# Common error schemas, derived from server/internal/handler/handler.go
# (~line 580): writeError / writeErrorCode / writeFeatureDisabled /
# writeRevisionConflict / writeEditConflict.

Error:
  type: object
  description: >-
    Generic error body written by writeError (handler.go ~line 580). Used
    whenever a handler has no machine-readable code for the failure.
  required: [error]
  properties:
    error:
      type: string
      description: Human-readable (English) error message.
  additionalProperties: false

ErrorCode:
  type: object
  description: >-
    Error body written by writeErrorCode (handler.go ~line 588), plus its
    writeFeatureDisabled wrapper (~line 595, always HTTP 403). `code` is a
    stable, UI-translatable identifier.


    The `code` enum below is every machine-readable code actually reaching
    the wire via writeErrorCode or writeFeatureDisabled in production
    handlers as of the baseline revision — originally 50 distinct values,
    plus 6 added by the issue-workflows domain (PPBM-3040):
    invalid_handoff, invalid_workflow, project_workflows_disabled,
    status_create_forbidden, workflow_is_default, workflow_name_taken — all
    from server/internal/handler/issue_workflow.go's direct
    writeErrorCode(...)/writeFeatureDisabled(...) call sites, same
    bare-{error,code} shape as every other value here (the two codes this
    domain also emits with extra fields, workflow_in_use and
    workflow_status_mapping_required, are intentionally NOT added — see
    components/schemas/issue-workflows.yaml, same precedent as
    issue_status_in_use in issue-resources.yaml). The originating ticket
    described this set as "24종 한정"; that count
    matches only the direct writeErrorCode(...) call sites with a literal
    string argument, and misses two other sources: (1) 17 further codes
    that reach the wire through the writeFeatureDisabled(...) wrapper,
    which produces the identical {error, code} shape via the same
    writeErrorCode function one level down, and (2) 10 codes passed to
    writeErrorCode as a named constant rather than an inline literal —
    server/internal/handler/auth.go's googleLoginCode* constants
    (account_disabled, signup_prohibited, email_not_allowed,
    google_account_no_email, oauth_code_invalid) and
    server/internal/handler/autopilot.go's autopilot*Code constants
    (autopilot_no_originator, autopilot_forbidden,
    autopilot_actor_not_member, autopilot_trigger_no_originator,
    autopilot_trigger_forbidden) — both missed by a literal-string-only
    grep. "feature_disabled" is deliberately excluded even though an
    earlier pass here included it: the only call site is
    server/internal/handler/handler_writejson_test.go exercising the
    writeFeatureDisabled helper itself; no production handler emits it.
    Implemented from source per "구현이 정본" — flagged to PM rather than
    silently truncated to 24 or left over-/under-counted.


    "revision_conflict" is intentionally excluded from this enum: every
    response using that code also carries resource_type/resource_id (and,
    for writeRevisionConflict, expected_revision/actual_revision), so it
    is always one of the RevisionConflict / EditConflict schemas instead
    of a bare ErrorCode.


    Two further codes reach the wire through neither
    writeErrorCode nor writeFeatureDisabled — each is built with its own
    writeJSON call carrying extra fields the bare {error, code} shape below
    does not model, so `code` membership here is all they borrow from this
    schema; the full payload is `InvitationRateLimitedResponse` /
    `RuntimeProfileDeleteBlockedResponse` in
    components/schemas/workspaces.yaml. (1) `invitation_rate_limited` — HTTP
    429, server/internal/handler/invitation_rate_limiter.go:181-193
    (`writeInvitationRateLimited`), on `POST /api/workspaces/{id}/members`
    once any of three independent sliding-window gates is exhausted: actor
    10/10min, workspace 50/24h, recipient-email 6/24h
    (DefaultInvitationRateLimits, same file:29-36); also carries
    `retry_after_seconds` and a matching `Retry-After` header. (2)
    `runtime_profile_has_active_agents` — HTTP 409,
    server/internal/handler/runtime_profile.go:392-468
    (`profileDeleteBlockedByAgents`), on a custom runtime profile delete
    whose runtimes still have one or more non-archived agents bound to
    them; also carries `active_agents` (capped sample), `active_agent_count`
    (real total), and `active_agents_truncated`.
  required: [error, code]
  properties:
    error:
      type: string
      description: Human-readable (English) fallback message.
    code:
      type: string
      enum:
        - account_disabled
        - autopilot_actor_not_member
        - autopilot_forbidden
        - autopilot_no_originator
        - autopilot_trigger_forbidden
        - autopilot_trigger_no_originator
        - cloud_runtime_misconfigured
        - cloud_runtime_not_configured
        - composio_not_configured
        - daemon_websocket_misconfigured
        - dingtalk_not_configured
        - duplicate_target_is_duplicate
        - email_not_allowed
        - file_upload_not_configured
        - github_repository_browsing_not_configured
        - google_account_no_email
        - google_login_not_configured
        - invalid_handoff
        - invalid_workflow
        - invitation_rate_limited
        - invitation_rate_limiter_unavailable
        - invocation_not_allowed
        - issue_has_duplicates
        - issue_in_triage
        - lark_not_configured
        - oauth_code_invalid
        - plugin_api_disabled
        - plugin_surfaces_misconfigured
        - plugin_surfaces_not_configured
        - project_workflows_disabled
        - runtime_profile_has_active_agents
        - seat_capacity_full
        - seat_capacity_overcommitted
        - seat_capacity_rate_limited
        - seat_capacity_unavailable
        - signup_prohibited
        - slack_not_configured
        - status_create_forbidden
        - storage_not_configured
        - suggestions_not_available
        - task_supplement_not_retryable
        - task_supplement_turn_ended
        - task_supplement_unsupported
        - telegram_not_configured
        - vcs_not_configured
        - wakeup_capacity_exceeded
        - wakeup_source_busy
        - wecom_bot_owned_by_another_workspace
        - wecom_bot_owned_by_archived_agent
        - wecom_bot_owned_by_same_workspace
        - wecom_credentials_rejected
        - wecom_credentials_unverifiable
        - wecom_install_failed
        - wecom_install_rejected
        - wecom_not_configured
        - workflow_is_default
        - workflow_name_taken
        - workspace_subscriptions_disabled
  additionalProperties: false

RevisionConflict:
  type: object
  description: >-
    409 response written by writeRevisionConflict (handler.go ~line 599)
    when a write's expected revision no longer matches the stored one
    (optimistic concurrency on a resource's whole revision counter).
  required:
    - error
    - code
    - resource_type
    - resource_id
    - expected_revision
    - actual_revision
  properties:
    error:
      type: string
      const: resource changed since it was loaded
    code:
      type: string
      const: revision_conflict
    resource_type:
      type: string
      description: >-
        Caller-supplied label for the conflicting resource kind; values
        are call-site-specific and not enumerated here (cross-domain).
    resource_id:
      type: string
      format: uuid
    expected_revision:
      type: integer
      format: int64
    actual_revision:
      type: integer
      format: int64
  additionalProperties: false

EditConflict:
  type: object
  description: >-
    409 response written by writeEditConflict (handler.go ~line 610) when
    a specific field changed since it was loaded, independent of the
    resource's overall revision counter.
  required: [error, code, resource_type, resource_id]
  properties:
    error:
      type: string
      const: resource field changed since it was loaded
    code:
      type: string
      const: revision_conflict
    resource_type:
      type: string
      description: >-
        Caller-supplied label for the conflicting resource kind; values
        are call-site-specific and not enumerated here (cross-domain).
    resource_id:
      type: string
      format: uuid
  additionalProperties: false
