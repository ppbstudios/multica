# Domain-specific schemas for the cloud/integrations domain (cloud-billing / cloud-subscriptions /
# cloud-runtime / integrations / social bindings / misc infra). Per
# docs/unofficial-api/README.md point 4, these merge into components.schemas
# the same as the shared openapi/components/schemas.yaml, just split by
# domain to avoid editing the Stage 1 file.
#
# cloud-billing / cloud-subscriptions request bodies are real Go structs
# (server/internal/handler/cloud_billing.go) validated before the proxy call,
# so those are documented precisely. Their 2xx RESPONSE bodies are NOT: both
# domains proxy byte-for-byte to the external multica-cloud service
# (cloudruntime.Do -> writeCloudRuntimeResponse, same file) and no Go struct
# unmarshals the upstream reply anywhere in this repo — only a JSON-validity
# check. CloudProxyResponse below documents that honestly instead of
# inventing field names; see each operation's response description for the
# specific upstream path it proxies to, if that's independently known from a
# comment.

CloudProxyResponse:
  type: object
  description: >-
    Opaque pass-through. The handler forwards the upstream multica-cloud
    HTTP response body byte-for-byte (writeCloudRuntimeResponse,
    server/internal/handler/cloud_runtime.go ~line 178) — no local Go type
    unmarshals it, so this repo's source does not define its field shape.
    소스에서 확인 불가: 실제 필드는 multica-cloud 서비스 쪽에 있으며 이
    레포에는 없음.
  additionalProperties: true

CloudSubscriptionCheckoutRequest:
  type: object
  description: >-
    server/internal/handler/cloud_billing.go, cloudSubscriptionCheckoutRequest.
  required: [interval]
  properties:
    interval:
      type: string
      enum: [month, year]
      description: Rejected with 400 if neither value (handler ~line 211).
    idempotency_key:
      type: string
      description: >-
        Optional in the body; if omitted the handler falls back to the
        `Idempotency-Key` header (requireCloudSubscriptionIdempotencyKey).
        One of the two is required — 400 if both are empty. Max 255 bytes.
  additionalProperties: false

CloudSubscriptionSeatPurchasePreviewRequest:
  type: object
  description: >-
    server/internal/handler/cloud_billing.go,
    cloudSubscriptionSeatPurchasePreviewRequest.
  required: [additional_seats]
  properties:
    additional_seats:
      type: integer
      description: Must be >= 1 (handler ~line 274); 400 otherwise.
  additionalProperties: false

CloudSubscriptionSeatPurchaseRequest:
  type: object
  description: >-
    server/internal/handler/cloud_billing.go, cloudSubscriptionSeatPurchaseRequest.
    This is the user-confirmed quote from a prior purchase-preview call, not a
    fresh purchase request — Cloud re-verifies everything server-side before
    charging.
  required:
    - additional_seats
    - expected_current_seats
    - expected_purchase_version
    - accepted_proration_amount
    - currency
  properties:
    additional_seats:
      type: integer
      description: Must be >= 1 (handler ~line 304).
    expected_current_seats:
      type: integer
      description: Must be >= 1. Optimistic-concurrency check against Cloud's current count.
    expected_purchase_version:
      type: integer
      format: int64
      description: Must be >= 1.
    accepted_proration_amount:
      type: integer
      format: int64
      description: Must be >= 0. Minor-unit amount the user confirmed from the preview step.
    currency:
      type: string
      description: >-
        3-letter ASCII currency code (handler validates isASCIICurrency, does
        NOT check against an ISO-4217 list); lowercased before forwarding.
      minLength: 3
      maxLength: 3
    idempotency_key:
      type: string
      description: >-
        Optional in the body; falls back to the `Idempotency-Key` header.
        One of the two is required. Max 200 bytes (stricter than the
        checkout-session limit of 255 — handler ~line 313).
  additionalProperties: false

ComposioConnectInitRequest:
  type: object
  description: server/internal/handler/integrations_composio.go, ComposioConnectInitRequest.
  required: [toolkit_slug]
  properties:
    toolkit_slug:
      type: string
      description: >-
        400 if blank; a slug the Composio integration doesn't support is
        also a 400 ("toolkit not supported"). The MVP only wires one
        toolkit (comment says Notion) — not independently re-verified
        against the toolkit catalog from this ticket.
  additionalProperties: false

ComposioConnectInitResponse:
  type: object
  description: server/internal/handler/integrations_composio.go, ComposioConnectInitResponse.
  required: [redirect_url]
  properties:
    redirect_url:
      type: string
      description: Hosted Composio Connect Link the frontend redirects the browser to.
  additionalProperties: false

ComposioConnectionResponse:
  type: object
  description: >-
    server/internal/handler/integrations_composio.go,
    ComposioConnectionResponse. One row of GET .../connections.
  required: [id, toolkit_slug, status, connected_at]
  properties:
    id:
      type: string
    toolkit_slug:
      type: string
    status:
      type: string
      description: >-
        Free-form string from the Composio service layer; no enum is
        checked or converted in this handler, so the value set is not
        verifiable from this file alone — 소스에서 확인 불가 (would require
        reading server/internal/integrations/composio).
    connected_at:
      type: string
    last_used_at:
      type: string
      nullable: true
  additionalProperties: false

ComposioToolkitResponse:
  type: object
  description: >-
    server/internal/handler/integrations_composio.go, ComposioToolkitResponse.
    One row of GET .../toolkits. Since MUL-4009 every entry is connectable
    (the service pre-filters); `connectable` is kept for older-client
    compatibility per the handler's own doc comment.
  required: [slug, name, connectable]
  properties:
    slug:
      type: string
    name:
      type: string
    logo:
      type: string
    category:
      type: string
    connectable:
      type: boolean
      description: Always true as of MUL-4009 (filtering moved upstream of this handler).
  additionalProperties: false

RedeemLarkBindingTokenRequest:
  type: object
  description: server/internal/handler/lark.go, RedeemLarkBindingTokenRequest.
  required: [token]
  properties:
    token:
      type: string
      description: 400 if empty. One-time token from the Lark bot's "you need to bind" reply card.
  additionalProperties: false

RedeemLarkBindingTokenResponse:
  type: object
  description: server/internal/handler/lark.go, RedeemLarkBindingTokenResponse.
  required: [workspace_id, installation_id, lark_open_id]
  properties:
    workspace_id:
      type: string
      format: uuid
    installation_id:
      type: string
      format: uuid
    lark_open_id:
      type: string
  additionalProperties: false

RedeemSlackBindingTokenRequest:
  type: object
  description: server/internal/handler/slack.go, RedeemSlackBindingTokenRequest.
  required: [token]
  properties:
    token:
      type: string
      description: 400 if empty.
  additionalProperties: false

RedeemSlackBindingTokenResponse:
  type: object
  description: server/internal/handler/slack.go, RedeemSlackBindingTokenResponse.
  required: [workspace_id, installation_id, slack_user_id]
  properties:
    workspace_id:
      type: string
      format: uuid
    installation_id:
      type: string
      format: uuid
    slack_user_id:
      type: string
  additionalProperties: false

RedeemDingTalkBindingTokenRequest:
  type: object
  description: server/internal/handler/dingtalk.go, RedeemDingTalkBindingTokenRequest.
  required: [token]
  properties:
    token:
      type: string
      description: 400 if empty.
  additionalProperties: false

RedeemDingTalkBindingTokenResponse:
  type: object
  description: server/internal/handler/dingtalk.go, RedeemDingTalkBindingTokenResponse.
  required: [workspace_id, installation_id, dingtalk_user_id]
  properties:
    workspace_id:
      type: string
      format: uuid
    installation_id:
      type: string
      format: uuid
    dingtalk_user_id:
      type: string
  additionalProperties: false

RedeemWecomBindingTokenRequest:
  type: object
  description: server/internal/handler/wecom_web.go, RedeemWecomBindingTokenRequest.
  required: [token]
  properties:
    token:
      type: string
      description: 400 if empty. Body is additionally size-capped (wecomBodyLimit) before decoding.
  additionalProperties: false

RedeemWecomBindingTokenResponse:
  type: object
  description: server/internal/handler/wecom_web.go, RedeemWecomBindingTokenResponse.
  required: [workspace_id, installation_id, wecom_user_id]
  properties:
    workspace_id:
      type: string
      format: uuid
    installation_id:
      type: string
      format: uuid
    wecom_user_id:
      type: string
  additionalProperties: false

RedeemTelegramBindingTokenRequest:
  type: object
  description: server/internal/handler/telegram.go, RedeemTelegramBindingTokenRequest.
  required: [token]
  properties:
    token:
      type: string
      description: 400 if empty.
  additionalProperties: false

RedeemTelegramBindingTokenResponse:
  type: object
  description: server/internal/handler/telegram.go, RedeemTelegramBindingTokenResponse.
  required: [workspace_id, installation_id, telegram_user_id]
  properties:
    workspace_id:
      type: string
      format: uuid
    installation_id:
      type: string
      format: uuid
    telegram_user_id:
      type: string
  additionalProperties: false

AppConfig:
  type: object
  description: >-
    server/internal/handler/config.go, AppConfig. Served by the PUBLIC
    GET /api/config — only ever put fields here that are safe for an
    anonymous caller (per the handler's own doc comment).
  properties:
    cdn_domain:
      type: string
    cdn_signed:
      type: boolean
      description: Omitted (not just false) when CloudFront signing is disabled.
    allow_signup:
      type: boolean
    google_client_id:
      type: string
    workspace_creation_disabled:
      type: boolean
      description: Omitted when false.
    daemon_server_url:
      type: string
      description: Omitted on the official managed cloud and when unset.
    daemon_app_url:
      type: string
      description: Omitted on the official managed cloud and when unset.
    vcs_integration_available:
      type: boolean
      description: Omitted when false.
    posthog_key:
      type: string
    posthog_host:
      type: string
    analytics_environment:
      type: string
    feature_flags:
      type: object
      additionalProperties:
        type: boolean
      description: >-
        Only frontend-safe boolean flags (featureflags.EvaluateFrontendPublicFlags);
        the full flag rule set is intentionally never exposed here.
    local_worktree_supported:
      type: boolean
    agent_conversation_starters_supported:
      type: boolean
    issue_create_properties_supported:
      type: boolean
    comment_delete_keep_replies_supported:
      type: boolean
    server_version:
      type: string
      description: Only emitted on self-hosted deployments; omitted on the managed cloud.
  additionalProperties: false

RefreshSessionResponse:
  type: object
  description: server/internal/handler/session.go, RefreshSessionResponse.
  required: [expires_at, renewed, check_again_in_seconds]
  properties:
    token:
      type: string
      description: >-
        Present only for bearer/header-authenticated callers (Desktop,
        mobile) that hold the session as a string. Cookie-authenticated
        browsers get the renewed session via Set-Cookie and this field is
        omitted.
    expires_at:
      type: string
      description: RFC3339 timestamp (formatSessionExpiry).
    renewed:
      type: boolean
      description: >-
        false is a normal answer (caller asked outside the renewal window
        or a non-fatal re-sign failure occurred), not an error.
    check_again_in_seconds:
      type: integer
      description: Caller should wait this long before polling again (auth.SessionRenewCheckInterval).
  additionalProperties: false

LiveResponse:
  type: object
  description: server/cmd/server/health.go, liveResponse. Always HTTP 200 — process-up check only.
  required: [status]
  properties:
    status:
      type: string
      const: ok
    pid:
      type: integer
      description: Omitted if zero (never in practice — os.Getpid()).
    commit:
      type: string
      description: Omitted if the build didn't stamp a commit.
    started_at:
      type: string
      description: RFC3339; omitted only if startedAt was never set (construction-time only).
  additionalProperties: false

SendCodeRequest:
  type: object
  description: server/internal/handler/auth.go:113-115 (`SendCodeRequest`). Backs POST /auth/send-code.
  required: [email]
  properties:
    email:
      type: string
      format: email

VerifyCodeRequest:
  type: object
  description: server/internal/handler/auth.go:117-120 (`VerifyCodeRequest`). Backs POST /auth/verify-code.
  required: [email, code]
  properties:
    email:
      type: string
      format: email
    code:
      type: string
      description: 6-digit code (generateCode, auth.go ~line 122); a dev-only override bypasses this check off production (isDevVerificationCode).

GoogleLoginRequest:
  type: object
  description: server/internal/handler/auth.go:513-516 (`GoogleLoginRequest`). Backs POST /auth/google.
  required: [code]
  properties:
    code:
      type: string
      description: OAuth authorization code from Google's redirect.
    redirect_uri:
      type: string
      description: >-
        Falls back to the server's GOOGLE_REDIRECT_URI env var when omitted
        or empty (auth.go ~line 575-578); must match whatever redirect URI
        Google issued the code against or the token exchange fails.

LoginResponse:
  type: object
  description: >-
    server/internal/handler/auth.go:108-111 (`LoginResponse`). Returned by
    POST /auth/verify-code and POST /auth/google on success, alongside the
    HttpOnly auth + CSRF cookies set on the response (and CloudFront signed
    cookies when configured).
  required: [token, user]
  properties:
    token:
      type: string
      description: Signed session JWT, the same value set in the HttpOnly auth cookie.
    user:
      $ref: '#/components/schemas/UserResponse'

# ---------------------------------------------------------------------------
# /api/plugin-bridge/v1/* — browser-session relay for the Plugin Action API.
# These mirror server/pkg/publicapi/v1/types.go field-for-field (same Go
# types, same handler functions as the official /v1 contract in
# server/pkg/publicapi/v1/openapi.yaml, which is out of this ticket's scope)
# but are named Plugin* here to avoid colliding with this document's own
# Issue/Comment schema names, which describe the full App API shapes.
# ---------------------------------------------------------------------------

PluginContext:
  type: object
  description: >-
    server/pkg/publicapi/v1/types.go:5-12 (`Context`), built by
    GetPluginContext (server/internal/handler/plugin_action.go ~line 269).
  required: [workspace, config, granted_net_domains, actor]
  properties:
    workspace:
      $ref: '#/components/schemas/PluginContextWorkspace'
    user:
      allOf: [{ $ref: '#/components/schemas/PluginContextUser' }]
      description: Omitted when the caller acts as the Plugin installation itself (no member behind the call).
    issue:
      allOf: [{ $ref: '#/components/schemas/PluginContextIssue' }]
      description: Present only when the request's `issue_id` query parameter names an issue the caller can reach.
    config:
      type: object
      additionalProperties: true
    granted_net_domains:
      type: array
      items: { type: string }
    actor:
      type: string
      enum: [member, plugin]

PluginContextWorkspace:
  type: object
  description: server/pkg/publicapi/v1/types.go:14-18.
  required: [id, name, slug]
  properties:
    id: { type: string }
    name: { type: string }
    slug: { type: string }

PluginContextUser:
  type: object
  description: server/pkg/publicapi/v1/types.go:20-23.
  required: [id, name]
  properties:
    id: { type: string }
    name: { type: string }

PluginContextIssue:
  type: object
  description: server/pkg/publicapi/v1/types.go:25-29.
  required: [id, identifier, title]
  properties:
    id: { type: string }
    identifier: { type: string }
    title: { type: string }

PluginIssue:
  type: object
  description: >-
    server/pkg/publicapi/v1/types.go:34-60 (`Issue`). Returned by GET/PATCH
    /api/plugin-bridge/v1/issues/{issue_ref}
    (server/internal/handler/plugin_action.go, pluginIssuePayload ~line
    447) — an explicit, independently-maintained subset of the App API's
    full issue shape, not a reuse of it.
  required:
    - id
    - workspace_id
    - number
    - identifier
    - title
    - description
    - status
    - priority
    - assignee_type
    - assignee_id
    - creator_type
    - creator_id
    - parent_issue_id
    - project_id
    - position
    - stage
    - start_date
    - due_date
    - created_at
    - updated_at
    - revision
    - last_activity_at
    - metadata
    - properties
  properties:
    id: { type: string }
    workspace_id: { type: string }
    number: { type: integer, format: int32 }
    identifier: { type: string }
    title: { type: string }
    description: { type: [string, "null"] }
    status: { type: string }
    status_category: { type: string }
    priority: { type: string }
    assignee_type: { type: [string, "null"] }
    assignee_id: { type: [string, "null"] }
    creator_type: { type: string }
    creator_id: { type: string }
    parent_issue_id: { type: [string, "null"] }
    project_id: { type: [string, "null"] }
    position: { type: number }
    stage: { type: [integer, "null"], format: int32 }
    start_date: { type: [string, "null"], format: date }
    due_date: { type: [string, "null"], format: date }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    revision: { type: integer, format: int64, minimum: 1 }
    last_activity_at: { type: [string, "null"], format: date-time }
    metadata: { type: object, additionalProperties: true }
    properties: { type: object, additionalProperties: true }

PluginPatchIssueRequest:
  type: object
  description: >-
    server/pkg/publicapi/v1/types.go:62-66 (`PatchIssueRequest`). Title
    and/or description only — PatchPluginIssue (plugin_action.go ~line
    350) refuses an empty body and rejects an empty title string.
  properties:
    expected_revision: { type: integer, format: int64, minimum: 1 }
    title: { type: string }
    description: { type: string }
  anyOf:
    - required: [title]
    - required: [description]

PluginComment:
  type: object
  description: server/pkg/publicapi/v1/types.go:68-79 (`Comment`).
  required: [id, author_type, author_id, content, type, created_at]
  properties:
    id: { type: string }
    author_type: { type: string, enum: [member, agent, plugin] }
    author_id: { type: string }
    content: { type: string }
    type: { type: string }
    parent_id: { type: string }
    created_at: { type: string, format: date-time }
    deleted_at:
      type: string
      format: date-time
      description: Set only on a deleted comment kept as an empty placeholder because it still has replies.

PluginCommentListResponse:
  type: object
  description: >-
    server/pkg/publicapi/v1/types.go:81-83. Newest 200 comments, in
    chronological order (ListPluginComments, plugin_action.go ~line 483,
    maxPluginCommentsPerRead).
  required: [comments]
  properties:
    comments:
      type: array
      items:
        $ref: '#/components/schemas/PluginComment'

PluginCreateCommentRequest:
  type: object
  description: >-
    server/pkg/publicapi/v1/types.go:85-88. CreatePluginComment
    (plugin_action.go ~line 534) does not run @mention dispatch, unlike
    the ordinary comment-create endpoint.
  required: [content]
  properties:
    content: { type: string, maxLength: 65536 }
    parent_id: { type: string }

PluginStorageKey:
  type: object
  description: server/pkg/publicapi/v1/types.go:90-94.
  required: [key, size_bytes, updated_at]
  properties:
    key: { type: string }
    size_bytes: { type: integer, format: int64 }
    updated_at: { type: string, format: date-time }

PluginStorageKeyListResponse:
  type: object
  description: server/pkg/publicapi/v1/types.go:96-98.
  required: [keys]
  properties:
    keys:
      type: array
      items:
        $ref: '#/components/schemas/PluginStorageKey'

PluginStorageValueResponse:
  type: object
  description: server/pkg/publicapi/v1/types.go:100-102.
  required: [value]
  properties:
    value: { type: string }

PluginPutStorageValueRequest:
  type: object
  description: server/pkg/publicapi/v1/types.go:104-106.
  required: [value]
  properties:
    value: { type: string, maxLength: 102400 }

PluginProblem:
  type: object
  description: >-
    server/pkg/publicapi/v1/problem.go (`Problem`, `WriteProblem`,
    `ProblemContentType`). Every error from an `/api/plugin-bridge/v1/*`
    operation uses this RFC 9457-flavored envelope rather than this
    document's plain `Error`/`ErrorCode` shapes — served as
    `application/problem+json`, not `application/json`. `error` is a
    compatibility alias for `detail` for existing Plugin clients; new
    callers should branch on `code`.
  required: [type, title, status, code, detail, request_id, error]
  properties:
    type: { type: string, format: uri }
    title: { type: string }
    status: { type: integer }
    code:
      type: string
      description: >-
        Stable machine code. CodeForStatus (problem.go) maps a bare HTTP
        status to one of invalid_request / unauthorized / payment_required
        / forbidden / not_found / conflict / incompatible / rate_limited /
        quota_exceeded / service_unavailable / upstream_unavailable /
        internal_error; several call sites in
        server/internal/handler/plugin_action.go pass a more specific code
        instead (e.g. missing_scope, member_required, plugin_api_disabled,
        revision_conflict) — see each operation's 4xx response below for
        the codes it can actually produce.
    detail: { type: string }
    request_id: { type: string }
    error:
      type: string
      deprecated: true
      description: Compatibility alias for detail.
    errors:
      type: array
      items:
        type: object
        required: [field, code, message]
        properties:
          field: { type: string }
          code: { type: string }
          message: { type: string }

ReadinessResponse:
  type: object
  description: >-
    server/cmd/server/health.go, readinessResponse. Backs both GET /readyz
    and GET /healthz (identical handler, h.readyHandler). 200 when
    status=ok; 503 otherwise (DB unreachable, or this binary's required
    migrations aren't all applied). Response is cached per-process for up
    to 3s (readinessCacheTTL) — a 503 can lag a just-completed migration by
    that long.
  required: [status, checks]
  properties:
    status:
      type: string
      enum: [ok, not_ready]
    checks:
      type: object
      required: [db, migrations]
      properties:
        db:
          type: string
          enum: [ok, error]
        migrations:
          type: string
          enum: [ok, error, unknown]
          description: unknown when the db check itself already failed (migrations were never queried).
      additionalProperties: false
  additionalProperties: false
