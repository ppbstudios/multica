# Domain-specific schemas for the workspaces domain (workspaces / members / invitations /
# mcp-servers / plugins / runtime-profiles / share-links / github / vcs /
# lark / dingtalk / slack / telegram / wecom / dashboard — 78 endpoints).
# Nested under components/schemas/ per docs/unofficial-api/README.md point 4
# so these merge into components.schemas without touching the shared
# components/schemas.yaml (Error / ErrorCode / RevisionConflict / EditConflict
# only).
#
# Every schema below is reverse-engineered from server/internal/handler/*.go;
# file:line citations are in each schema's description. Unconfirmed details
# are called out explicitly rather than guessed, per the parent ticket's rule.

# ---------------------------------------------------------------------------
# Workspace core (workspace.go)
# ---------------------------------------------------------------------------

WorkspaceResponse:
  type: object
  description: workspace.go:97-109 (`WorkspaceResponse`), built by `workspaceToResponse` (workspace.go:111-136).
  required: [id, name, slug, description, context, settings, repos, issue_prefix, avatar_url, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    name: {type: string}
    slug: {type: string}
    description: {type: [string, "null"]}
    context: {type: [string, "null"]}
    settings:
      description: >-
        Arbitrary JSON object; unmarshalled from the stored column, defaults
        to `{}` when the column is empty/null (workspace.go:116-120).
      type: object
      additionalProperties: true
    repos:
      description: >-
        Array of `{url, description}` repo references; defaults to `[]` when
        the stored column is empty/null (workspace.go:122-126). See
        `WorkspaceRepoRef` for the entry shape enforced on write.
      type: array
      items: {$ref: '#/components/schemas/WorkspaceRepoRef'}
    issue_prefix: {type: string}
    avatar_url:
      type: [string, "null"]
      description: Resolved via `h.resolveAvatarURLPtr` (possibly rewritten/signed; not independently re-verified).
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

WorkspaceRepoRef:
  type: object
  description: >-
    workspace.go:332-335 (`workspaceRepoRef`), the per-entry shape enforced by
    `validateAndNormalizeWorkspaceRepos` on PUT/PATCH /api/workspaces/{id}.
    `url` must pass `isValidGitRepoURL` (http/https/ssh/git scheme with a
    host, or an scp-like `[user@]host:path`); duplicate URLs are de-duped.
  required: [url]
  properties:
    url: {type: string}
    description: {type: string}

CreateWorkspaceRequest:
  type: object
  description: workspace.go:194-200 (`CreateWorkspaceRequest`). See `CreateWorkspace` (workspace.go:202-320).
  required: [name, slug]
  properties:
    name:
      type: string
      description: Required; trimmed, 400 "name and slug are required" if empty after trim.
    slug:
      type: string
      description: >-
        Required; lowercased+trimmed, must match `^[a-z0-9]+(-[a-z0-9]+)*$`
        and must not be a reserved slug (400 "slug is reserved").
    description: {type: [string, "null"]}
    context: {type: [string, "null"]}
    issue_prefix:
      type: [string, "null"]
      description: >-
        Optional. If provided, normalized to `^[A-Z0-9]{1,10}$` (uppercased,
        trimmed) or 400 on mismatch. If blank/absent, derived from `slug` via
        `defaultIssuePrefixFromSlug` (first 4 alphanumeric chars, uppercased).

UpdateWorkspaceRequest:
  type: object
  description: >-
    workspace.go:322-330 (`UpdateWorkspaceRequest`). All fields optional —
    only non-nil fields are applied (PATCH semantics; PUT uses the identical
    handler, `UpdateWorkspace`, workspace.go:373-497).
  properties:
    name:
      type: string
      description: If present, trimmed; 400 "name is required" if it becomes empty.
    description: {type: [string, "null"]}
    context: {type: [string, "null"]}
    settings:
      type: object
      additionalProperties: true
      description: >-
        If a `map[string]any` containing the legacy PR-auto-complete key, it
        is merged with stored settings via `reconcilePRMergeSettings`
        (internals not traced — not re-read in this pass).
    repos:
      type: array
      items: {$ref: '#/components/schemas/WorkspaceRepoRef'}
    issue_prefix:
      type: string
      description: Normalized like create; a blank value means "leave unchanged" (not cleared).
    avatar_url:
      type: [string, "null"]
      description: >-
        Validated via `acceptAvatarURL` — must be a standalone image upload,
        not an attachment already bound to an issue/comment/chat (403 if so);
        skipped when unchanged from the stored value.

MemberWithUserResponse:
  type: object
  description: workspace.go:499-508 (`MemberWithUserResponse`).
  required: [id, workspace_id, user_id, role, created_at, name, email, avatar_url]
  properties:
    id: {type: string, format: uuid}
    workspace_id: {type: string, format: uuid}
    user_id: {type: string, format: uuid}
    role: {type: string, enum: [owner, admin, member]}
    created_at: {type: string, format: date-time}
    name: {type: string}
    email: {type: string, format: email}
    avatar_url: {type: [string, "null"]}

CreateMemberRequest:
  type: object
  description: >-
    workspace.go:540-543 (`CreateMemberRequest`). Despite the URL
    (`POST /api/workspaces/{id}/members`) this creates an INVITATION, not a
    member row — the handler is `h.CreateInvitation` (invitation.go:61),
    reused struct name notwithstanding. Response is `InvitationResponse`.
  required: [email]
  properties:
    email:
      type: string
      format: email
      description: Required; lowercased/trimmed, 400 "email is required" if empty.
    role:
      type: string
      enum: [admin, member]
      description: >-
        Optional, default `member` via `normalizeMemberRole`. `"owner"` is
        explicitly rejected (400 "cannot invite as owner") — not a valid
        enum value for this request despite being a valid member role.

UpdateMemberRequest:
  type: object
  description: workspace.go:572-574 (`UpdateMemberRequest`). See `UpdateMember` (workspace.go:576-650).
  required: [role]
  properties:
    role:
      type: string
      enum: [owner, admin, member]
      description: >-
        Required (400 "role is required" if blank). Only an `owner` requester
        may touch an owner-role member or grant the `owner` role (403
        "insufficient permissions" otherwise); demoting the sole remaining
        owner is rejected (400 "workspace must have at least one owner").

# ---------------------------------------------------------------------------
# Invitations (invitation.go)
# ---------------------------------------------------------------------------

InvitationResponse:
  type: object
  description: >-
    invitation.go:24-39 (`InvitationResponse`). `inviter_name` /
    `inviter_email` / `workspace_name` are enrichment fields populated only on
    some list/get paths (see each operation's description) — `omitempty`, so
    absent rather than empty-string when not enriched.
  required: [id, workspace_id, inviter_id, invitee_email, invitee_user_id, role, status, created_at, updated_at, expires_at]
  properties:
    id: {type: string, format: uuid}
    workspace_id: {type: string, format: uuid}
    inviter_id: {type: string, format: uuid}
    invitee_email: {type: string, format: email}
    invitee_user_id: {type: [string, "null"], format: uuid}
    role: {type: string, enum: [owner, admin, member]}
    status: {type: string, description: "Observed values include pending/accepted/declined/revoked; full enum not exhaustively confirmed from this file alone."}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}
    expires_at: {type: string, format: date-time}
    inviter_name: {type: string}
    inviter_email: {type: string, format: email}
    workspace_name: {type: string}

InvitationRateLimitedResponse:
  type: object
  description: >-
    429 body written by `writeInvitationRateLimited` (invitation_rate_limiter.go:181-193)
    on `POST /api/workspaces/{id}/members` when the actor (10/10min), workspace
    (50/24h), or recipient (6/24h) sliding-window limit is exceeded. Also sets
    a `Retry-After` header (seconds, same value as `retry_after_seconds`).
    `invitation_rate_limited` is now a member of the shared `ErrorCode` enum
    (components/schemas.yaml) — `code` below references
    that enum's `code` property instead of redeclaring the value. Kept as its
    own schema rather than an `allOf` of the full `ErrorCode` object: that
    object's `additionalProperties: false` would reject `retry_after_seconds`
    as an undeclared property of the ErrorCode branch.
  required: [error, code, retry_after_seconds]
  properties:
    error: {type: string, const: "too many invitation requests"}
    code:
      $ref: '#/components/schemas/ErrorCode/properties/code'
      const: invitation_rate_limited
    retry_after_seconds: {type: integer, format: int64}

# ---------------------------------------------------------------------------
# Workspace MCP servers (workspace_mcp_api.go)
# ---------------------------------------------------------------------------

WorkspaceMcpServerResponse:
  type: object
  description: >-
    The intentionally non-secret shape of one workspace MCP server library
    entry. Deliberately excludes `url` / `command` / `args` / `headers` /
    `env` — any of those routinely carries a bearer credential (even a
    Composio-style session URL is one on its own) — mirroring the daemon's
    own redaction line for the same reason.
  required: [id, workspace_id, name, transport, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    workspace_id:
      type: string
      format: uuid
    name:
      type: string
    transport:
      type: string
      description: >-
        One of `stdio` / `http` derived from an explicit or inferred
        `type`/`command`/`url` in the stored config, `unknown` if neither is
        present or the config is unparseable, or — for an explicit `type`
        this server does not recognise (e.g. `sse`, or a future client's
        invention) — that value passed through verbatim rather than
        collapsed to `http`/`stdio`. Never reconstructed lossily: an
        unrecognised explicit type would otherwise round-trip through a form
        that silently rewrites the entry to a different protocol.
    enabled:
      type: boolean
      nullable: true
      description: >-
        Only meaningful (and only present) on the agent-scoped MCP server
        responses, where it reflects that binding's toggle. Omitted by the
        workspace-level library listing, which describes the entry itself,
        not an assignment.
    agent_count:
      type: integer
      format: int64
      nullable: true
      description: >-
        How many live (non-archived) agents this entry is assigned to. Only
        the workspace-level library listing populates this; agent-scoped
        responses omit it.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  additionalProperties: false

WorkspaceMcpServerRequest:
  type: object
  description: >-
    workspace_mcp_api.go:145-148 (`WorkspaceMcpServerRequest`). On POST both
    fields are required; on PUT both are optional partial-update fields (a
    blank/absent `name` or empty/absent `config` leaves the existing value
    unchanged via `COALESCE` — see each operation).
  properties:
    name:
      type: string
      description: "`validateWorkspaceMcpServerName`: trimmed, non-empty, `[a-zA-Z0-9_-]` only."
    config:
      description: >-
        `validateWorkspaceMcpServerEntry`: trimmed non-empty, must parse as a
        JSON object, and the parsed object must not be `{}`. Opaque server
        config (transport/command/url/etc.) — shape not schema-validated
        beyond "non-empty JSON object".
      type: object
      additionalProperties: true

# ---------------------------------------------------------------------------
# Plugins (plugin.go, plugin_package.go, plugin_mcp.go, plugin_surface.go,
# plugin_hook.go)
# ---------------------------------------------------------------------------

PluginInstallationResponse:
  type: object
  description: >-
    plugin.go:58-77 (`pluginInstallationResponse`). `config` holds only
    non-secret fields by construction (secrets route to a separate encrypted
    table via `SetConfig`); `configured_secrets` names which secret fields
    are set, never their values.
  required: [id, plugin_key, name, version, package_version_id, enabled, granted_scopes, config_schema, config, configured_secrets, surfaces, hooks, resources, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    plugin_key: {type: string}
    name: {type: string}
    description: {type: string}
    version: {type: string}
    package_version_id: {type: string, format: uuid}
    enabled: {type: boolean}
    granted_scopes: {type: array, items: {type: string}}
    config_schema: {type: array, items: {$ref: '#/components/schemas/PluginConfigField'}}
    config: {type: object, additionalProperties: true}
    configured_secrets: {type: array, items: {type: string}}
    surfaces: {type: array, items: {$ref: '#/components/schemas/PluginSurface'}}
    hooks: {type: array, items: {$ref: '#/components/schemas/PluginHookResponse'}}
    resources: {type: array, items: {$ref: '#/components/schemas/PluginResource'}}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

PluginConfigField:
  type: object
  description: server/internal/service/plugin.go:176-185 (`PluginConfigField`).
  required: [key, type, label, required]
  properties:
    key: {type: string}
    type: {type: string}
    label: {type: string}
    description: {type: string}
    required: {type: boolean}
    options: {type: array, items: {type: string}}
    placeholder: {type: string}
    multiline: {type: boolean}

PluginSurface:
  type: object
  description: server/pkg/plugincontract/manifest.go:203-209 (`Surface`), one plugin-provided UI surface.
  required: [key, type, name, entry]
  properties:
    key: {type: string}
    type: {type: string}
    name: {type: string}
    entry: {type: string}
    platforms: {type: array, items: {type: string}}

PluginResource:
  type: object
  description: server/pkg/plugincontract/manifest.go:240-244 (`Resource`).
  required: [type, key, entry]
  properties:
    type: {type: string}
    key: {type: string}
    entry: {type: string}

PluginHookResponse:
  type: object
  description: >-
    plugin.go:82-90 (`pluginHookResponse`). Deliberately omits the hook's
    input JSON Schema (noise on a settings page).
  required: [key, name, description, triggers, transport]
  properties:
    key: {type: string}
    name: {type: string}
    description: {type: string}
    triggers: {type: array, items: {type: string}}
    events: {type: array, items: {type: string}}
    transport: {type: string}
    schedule: {$ref: '#/components/schemas/PluginHookScheduleResponse'}

PluginHookScheduleResponse:
  type: object
  description: plugin.go:92-96 (`pluginHookScheduleResponse`).
  required: [cron, timezone]
  properties:
    cron: {type: string}
    timezone: {type: string}
    next_run_at: {type: string, format: date-time}

PreviewPluginRequest:
  type: object
  description: >-
    plugin.go:206-208 (`previewPluginRequest`). Writes nothing — step one of
    the two-step install, so the admin can read the scope list before
    consenting.
  required: [version_id]
  properties:
    version_id: {type: string, format: uuid}

PluginPreviewResponse:
  type: object
  description: server/internal/service/plugin.go:162-173 (`PluginPreview`).
  required: [manifest, scopes, config_schema, version_id, version, digest, installed]
  properties:
    manifest:
      type: object
      additionalProperties: true
      description: "plugincontract.Manifest — full plugin manifest contract; not modeled field-by-field in this pass (out of the 4 handler files read for this ticket)."
    scopes: {type: array, items: {type: string}}
    config_schema: {type: array, items: {$ref: '#/components/schemas/PluginConfigField'}}
    version_id: {type: string, format: uuid}
    version: {type: string}
    digest: {type: string}
    installed: {type: boolean}
    installed_version: {type: string}
    added_scopes: {type: array, items: {type: string}}

InstallPluginRequest:
  type: object
  description: >-
    plugin.go:235-238 (`installPluginRequest`). Should reuse the same
    `version_id` a prior `PreviewPlugin` call returned, so the consented
    manifest and the executed code are the same artifact.
  required: [version_id]
  properties:
    version_id: {type: string, format: uuid}
    granted_scopes:
      type: array
      items: {type: string}
      description: Must match the manifest's scopes exactly (409 if not — see operation).

ConfigurePluginRequest:
  type: object
  description: plugin.go:272-274 (`configurePluginRequest`).
  required: [values]
  properties:
    values:
      type: object
      additionalProperties: true
      description: Keyed by `PluginConfigField.key`; unknown keys or oversized secret values are rejected (422/400 — see operation).

PluginPackageSummary:
  type: object
  description: server/internal/service/plugin_package.go:49-55 (`PluginPackageSummary`).
  required: [id, plugin_key, name, versions, created_at]
  properties:
    id: {type: string, format: uuid}
    plugin_key: {type: string}
    name: {type: string}
    versions: {type: array, items: {$ref: '#/components/schemas/PluginPackageVersionSummary'}}
    created_at: {type: string, format: date-time}

PluginPackageVersionSummary:
  type: object
  description: server/internal/service/plugin_package.go:36-45 (`PluginPackageVersionSummary`).
  required: [id, version, digest, size_bytes, published_at, installed]
  properties:
    id: {type: string, format: uuid}
    version: {type: string}
    digest: {type: string}
    size_bytes: {type: integer, format: int64}
    published_at: {type: string, format: date-time}
    installed: {type: boolean, description: "Whether this version is the one currently installed in the requesting workspace."}

PublishLocalPluginRequest:
  type: object
  description: >-
    plugin_package.go:99-101 (`publishLocalPluginRequest`). Only usable when
    `MULTICA_PLUGIN_DIR` is configured (dev-only local plugin source).
  required: [name]
  properties:
    name:
      type: string
      description: "Required, non-empty; must not contain `/`, `\\`, or start with `.`."

PluginMCPToolResponse:
  type: object
  description: plugin_mcp.go:20-28 (`pluginMCPToolResponse`).
  required: [name, description, schema_digest, approved]
  properties:
    name: {type: string}
    description: {type: string}
    schema_digest: {type: string}
    approved: {type: boolean}
    drifted:
      type: boolean
      description: True only when the tool IS approved but its live schema digest no longer matches the approved one.

ApprovePluginMCPToolsRequest:
  type: object
  description: >-
    plugin_mcp.go:60-64 (`approvePluginMCPToolsRequest`). `tools` is the
    COMPLETE approved set, not a delta — omitting a previously-approved name
    revokes it.
  required: [tools]
  properties:
    tools: {type: array, items: {type: string}}

PluginInvocationResponse:
  type: object
  description: >-
    plugin_hook.go:107-118 (`pluginInvocationResponse`). Only metadata about
    what happened (status/latency/error), never the request/response body.
  required: [id, hook_key, trigger, status, attempt, latency_ms, created_at]
  properties:
    id: {type: string, format: uuid}
    hook_key: {type: string}
    trigger: {type: string}
    status: {type: string}
    event_type: {type: string}
    attempt: {type: integer}
    latency_ms: {type: integer}
    error: {type: string}
    delivery_id: {type: string}
    planned_at: {type: string, format: date-time}
    created_at: {type: string, format: date-time}

PluginTokenResponse:
  type: object
  description: >-
    plugin_hook.go:170-177 (`pluginTokenResponse`). Returned exactly once, on
    the request that mints it — there is no read endpoint; a lost token is
    rotated, not recovered.
  required: [token]
  properties:
    token: {type: string}
    signing_secret: {type: string, description: "Derived from the deployment key (stable per installation, reproducible without a DB copy), not a separately stored secret."}

PluginSurfaceLaunchResponse:
  type: object
  description: >-
    plugin_surface.go:43-48 (`pluginSurfaceLaunch`). Short-lived (2 minute
    TTL) launch descriptor; response is sent with `Cache-Control: private,
    no-store`.
  required: [url, bridge_token, version, digest]
  properties:
    url: {type: string, format: uri}
    bridge_token: {type: string}
    version: {type: string}
    digest: {type: string}

# ---------------------------------------------------------------------------
# Runtime profiles (runtime_profile.go)
# ---------------------------------------------------------------------------

RuntimeProfileResponse:
  type: object
  description: runtime_profile.go:35-49 (`RuntimeProfileResponse`).
  required: [id, workspace_id, display_name, protocol_family, runtime_type, command_name, description, fixed_args, visibility, created_by, enabled, created_at, updated_at]
  properties:
    id: {type: string, format: uuid}
    workspace_id: {type: string, format: uuid}
    display_name: {type: string}
    protocol_family: {type: string}
    runtime_type: {type: string}
    command_name: {type: string}
    description: {type: [string, "null"]}
    fixed_args: {type: array, items: {type: string}}
    visibility:
      type: string
      description: 'Always `"workspace"` as of the baseline revision — the request has no field for it; the server forces this constant (runtime_profile.go:76-84, MUL-3308 follow-up noted for a future value).'
    created_by: {type: [string, "null"], format: uuid}
    enabled: {type: boolean}
    created_at: {type: string, format: date-time}
    updated_at: {type: string, format: date-time}

CreateRuntimeProfileRequest:
  type: object
  description: runtime_profile.go:120-127 (`createRuntimeProfileRequest`).
  required: [display_name, command_name]
  properties:
    display_name: {type: string, description: "Required, trimmed non-empty."}
    protocol_family:
      type: string
      description: "Optional; if provided must be consistent with `runtime_type` (400 \"protocol_family does not match runtime_type\" otherwise). If omitted, derived from `runtime_type`."
    runtime_type:
      type: string
      description: "Effectively required: an empty value is normalized and, if unsupported, rejected with 400 \"unsupported runtime_type: <value>\"."
    command_name:
      type: string
      description: "Required; single executable token — no whitespace/newlines/NUL bytes (put arguments in `fixed_args`)."
    description: {type: [string, "null"]}
    fixed_args:
      type: array
      items: {type: string}
      description: "Each entry non-empty, no NUL bytes. Fixed args are inherited by every agent on this runtime — per-agent args belong in the agent's own `custom_args`, not here."
    enabled: {type: boolean, default: true}

UpdateRuntimeProfileRequest:
  type: object
  description: >-
    runtime_profile.go:267-275 (`updateRuntimeProfileRequest`). All fields
    optional/partial. `runtime_type` and `protocol_family` are immutable once
    created — if either is present (non-null) the whole request is rejected
    with 400 "runtime_type and protocol_family are immutable; create a new
    profile", regardless of whether the value would actually change anything.
  properties:
    runtime_type: {type: string, description: "Rejecting sentinel only — see above; never actually applied."}
    protocol_family: {type: string, description: "Rejecting sentinel only — see above; never actually applied."}
    display_name: {type: string, description: "If present, trimmed non-empty (400 \"display_name cannot be empty\" otherwise)."}
    command_name: {type: string, description: Same validation as create.}
    description: {type: [string, "null"]}
    fixed_args: {type: array, items: {type: string}}
    enabled: {type: boolean}

RuntimeProfileDeleteBlockedResponse:
  type: object
  description: >-
    409 body built by `profileDeleteBlockedByAgents` (runtime_profile.go:392-468)
    when one or more non-archived agents are still bound to runtimes of the
    profile being deleted. `runtime_profile_has_active_agents` is now a
    member of the shared `ErrorCode` enum (components/schemas.yaml) — `code` below references that enum's `code` property instead
    of redeclaring the value. Kept as its own schema rather than an `allOf`
    of the full `ErrorCode` object: that object's `additionalProperties:
    false` would reject `active_agents`/`active_agent_count`/
    `active_agents_truncated` as undeclared properties of the ErrorCode
    branch.
  required: [error, code, active_agents, active_agent_count, active_agents_truncated]
  properties:
    error:
      type: string
      description: Human-readable sentence listing up to 5 blocking agents plus remediation steps.
    code:
      $ref: '#/components/schemas/ErrorCode/properties/code'
      const: runtime_profile_has_active_agents
    active_agents:
      type: array
      items:
        type: object
        required: [id, name, kind, system_key, runtime_id, runtime_name, runtime_custom_name, runtime_status]
        properties:
          id: {type: string, format: uuid}
          name: {type: string}
          kind: {type: string}
          system_key: {type: [string, "null"]}
          runtime_id: {type: string, format: uuid}
          runtime_name: {type: string}
          runtime_custom_name: {type: [string, "null"]}
          runtime_status: {type: string}
      description: Capped sample (at most 5 entries) of the blocking agents.
    active_agent_count: {type: integer, format: int64, description: Real total blocker count (may exceed the sample size).}
    active_agents_truncated: {type: boolean, description: True when `active_agent_count` exceeds the sample returned in `active_agents`.}

RuntimeProfileDeleteRetryResponse:
  type: object
  description: >-
    409 body for the two other `DeleteRuntimeProfile` conflict branches
    (runtime_profile.go:475-640): a runtime of this profile still has tasks
    in flight, or has an invalid cross-workspace agent binding. Both codes
    ARE present in... actually neither is in the shared ErrorCode enum either
    — see each operation's response examples for the literal `code` values
    (`runtime_delete_not_drained`, `runtime_delete_workspace_mismatch`); not
    modeled as enum members here since they are call-site literals, not
    independently re-verified as exhaustive for this schema's scope.
  required: [error, code]
  properties:
    error: {type: string}
    code: {type: string, enum: [runtime_delete_not_drained, runtime_delete_workspace_mismatch]}

