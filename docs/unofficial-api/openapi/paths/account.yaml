  post:
    operationId: createProjectResource
    summary: Attach a resource to a project
    description: >-
      server/internal/handler/project_resource.go:547-625
      (`CreateProjectResource`). Workspace-scoped; any member may attach.
    tags: [Projects]
    security: *userAuth
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateProjectResourceRequest' }
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectResourceResponse' }
      '400':
        description: Invalid body, missing/invalid resource_type or resource_ref (shape depends on resource_type).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              resourceTypeRequired: { value: { error: "resource_type is required" } }
              refRequired: { value: { error: "resource_ref is required" } }
              unknownType: { value: { error: 'unknown resource_type "foo"' } }
              invalidExecutionMode: { value: { error: 'local_directory: execution_mode must be "in_place" or "worktree", got "bogus"' } }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '404':
        description: Project not found, or not in this workspace.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "project not found" }
      '409':
        description: This resource (project_id+resource_type+resource_ref) is already attached, or another local_directory already uses this daemon_id on the project.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              alreadyAttached: { value: { error: "this resource is already attached to the project" } }
              daemonConflict: { value: { error: "this daemon already has a local_directory attached to the project; remove it before adding another" } }
      '422':
        description: execution_mode=worktree requested on a daemon whose registered runtime doesn't advertise worktree support.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DaemonVersionUnsupportedError' }
      '500':
        description: Resource creation failed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to create project resource" }

/api/projects/{id}/resources/{resourceId}:
  put:
    operationId: updateProjectResource
    summary: Update a project resource
    description: >-
      server/internal/handler/project_resource.go:633-811
      (`UpdateProjectResource`). Workspace-scoped; any member may update.
      `resource_type` is immutable. A rename-only change to a
      local_directory's embedded label suppresses the worktree-capability
      gate. No optimistic-concurrency/revision guard.
    tags: [Projects]
    security: *userAuth
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: resourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateProjectResourceRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectResourceResponse' }
      '400':
        description: Invalid body, invalid resource_ref for the resource's existing type, label not string-or-null, or position not an integer.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              labelType: { value: { error: "label must be a string or null" } }
              positionType: { value: { error: "position must be an integer" } }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '404':
        description: Project not found, or the resource does not exist / belongs to a different project.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              projectNotFound: { value: { error: "project not found" } }
              resourceNotFound: { value: { error: "project resource not found" } }
      '409':
        description: Resource ref collides with an existing attachment, or another local_directory already uses this daemon_id on the project.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              alreadyAttached: { value: { error: "this resource is already attached to the project" } }
              daemonConflict: { value: { error: "another local_directory on this daemon is already attached to the project" } }
      '422':
        description: execution_mode=worktree requested (non-rename-only change) on a daemon whose registered runtime doesn't advertise worktree support.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DaemonVersionUnsupportedError' }
      '500':
        description: Update failed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to update project resource" }
  delete:
    operationId: deleteProjectResource
    summary: Remove a resource from a project
    description: >-
      server/internal/handler/project_resource.go:861-900
      (`DeleteProjectResource`). Workspace-scoped. Unlike DeleteProject,
      requires only plain membership — no owner/admin gate; any workspace
      member may delete any resource from any project.
    tags: [Projects]
    security: *userAuth
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: resourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      '204':
        description: Deleted.
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '404':
        description: Project not found, or the resource does not exist / belongs to a different project.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              projectNotFound: { value: { error: "project not found" } }
              resourceNotFound: { value: { error: "project resource not found" } }
      '500':
        description: Delete failed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to delete project resource" }

/api/share-links/{code}:
  get:
    operationId: getShareLinkInfo
    summary: Preview a workspace share link (public)
    description: >-
      server/internal/handler/share_link.go:240-260 (`GetShareLinkInfo`).
      Fully public — no auth. Lets a not-yet-logged-in visitor see what
      they'd be joining. Does not expose workspace_id, the code/id itself,
      the inviter's email, expiry, or usage count/limit. Revoked, expired,
      exhausted, and nonexistent links are all indistinguishable (same
      404) — this handler has no 500 path.
    tags: [Share Links]
    security: []
    parameters:
      - name: code
        in: path
        required: true
        description: Opaque string; server-generated codes are 24 lowercase hex chars, but any string is accepted and looked up as-is.
        schema: { type: string }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareLinkInfoResponse' }
      '400':
        description: Empty code.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "code is required" }
      '404':
        description: Link does not exist, is inactive/revoked, expired, or at its use-count limit (all indistinguishable).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "share link not found or expired" }

/api/share-links/join:
  post:
    operationId: joinByShareLink
    summary: Join a workspace via a share link
    description: >-
      server/internal/handler/share_link.go:264-457 (`JoinByShareLink`).
      User-scoped (authenticated), NOT workspace-scoped — the target
      workspace comes from the share-link code in the body, not a header.
      No `{code}` path parameter; the code is a body field only. Settles a
      matching pending email invitation in the same transaction if one
      exists (using the share link's role, not the invitation's). Marks
      the joining user onboarded as a side effect. Returns 200, not 201,
      despite creating a new membership.
    tags: [Share Links]
    security: *userAuth
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JoinByShareLinkRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareLinkJoinResponse' }
      '400':
        description: Invalid body, or empty code.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              codeRequired: { value: { error: "code is required" } }
      '401':
        description: Not authenticated.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '404':
        description: Link does not exist, is inactive/revoked, expired, or at its use-count limit at either the pre-check or the transactional claim (all indistinguishable).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "share link not found or expired" }
      '409':
        description: Caller is already a member of the target workspace (detected at pre-check, in-transaction re-check, or as a final unique-violation guard).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "you are already a member of this workspace" }
      '429':
        description: Seat-capacity service is rate-limited (only reachable when seat capacity is enabled for this deployment).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErrorCode' }
            example: { error: "Member capacity is busy. Please retry shortly.", code: "seat_capacity_rate_limited" }
      '500':
        description: Any step of the join transaction failed (user load, tx begin/commit, membership creation, onboarding finalize, capacity bookkeeping).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              generic: { value: { error: "failed to join workspace" } }
              loadUserFailed: { value: { error: "failed to load user" } }
              createMembershipFailed: { value: { error: "failed to create membership" } }
              onboardingFailed: { value: { error: "failed to finalize onboarding" } }
      '503':
        description: Seat-capacity could not be verified (capacity service unavailable; only reachable when seat capacity is enabled).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErrorCode' }
            example: { error: "Member capacity could not be verified. Please try again.", code: "seat_capacity_unavailable" }

/api/webhooks/autopilots/{token}:
  post:
    operationId: handleAutopilotWebhook
    summary: Inbound autopilot trigger webhook
    description: >-
      server/internal/handler/autopilot_webhook.go:347
      (`HandleAutopilotWebhook`). Public ingress — no Multica auth. The
      `{token}` path segment (format `awt_<43 url-safe-base64 chars>`) IS
      the credential, identifying a `webhook_trigger` row. If that trigger
      has a signing secret configured, the request must ALSO carry a valid
      `X-Hub-Signature-256: sha256=<hex hmac-sha256>` header over the raw
      body; without a configured secret, the bearer token alone suffices.
      The request body is an arbitrary provider-defined JSON object or
      array (제공자 측 payload — see the configured provider's own webhook
      documentation); it is normalized server-side into the stable
      WebhookEnvelope wrapper shown below, which is NOT what the caller
      sends.
    tags: [Webhooks]
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
      - name: X-Hub-Signature-256
        in: header
        required: false
        description: Required only when the resolved trigger has a signing secret configured.
        schema: { type: string }
      - name: X-GitHub-Delivery
        in: header
        required: false
        description: Dedupe key for the github provider.
        schema: { type: string }
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: Provider-defined payload (JSON object or array; scalars are rejected). See the configured provider's own webhook documentation.
    responses:
      '200':
        description: Admitted, ignored, skipped, or recognized as a duplicate delivery — all are 200.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AutopilotWebhookAcceptedResponse'
                - $ref: '#/components/schemas/AutopilotWebhookIgnoredResponse'
                - $ref: '#/components/schemas/AutopilotWebhookSkippedResponse'
                - $ref: '#/components/schemas/AutopilotWebhookDuplicateResponse'
      '400':
        description: Body is not valid JSON, is a bare scalar, is empty, or could not be read.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidJson: { value: { error: "invalid json: unexpected end of JSON input" } }
              notObjectOrArray: { value: { error: "body must be a JSON object or array" } }
              empty: { value: { error: "empty body" } }
              readFailed: { value: { error: "failed to read request body" } }
      '401':
        description: Signature verification failed for a trigger with a configured secret.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutopilotWebhookRejectedResponse' }
      '404':
        description: Unknown token, or the resolved trigger/autopilot/workspace do not line up (deliberately generic to avoid leaking valid tokens).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "webhook not found" }
      '413':
        description: Body exceeds the 256 KiB cap.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "payload too large" }
      '429':
        description: Rate limited.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "rate limit exceeded" }
        headers:
          Retry-After:
            schema: { type: string }
      '500':
        description: Internal failure (token/autopilot lookup, delivery persistence, envelope encoding, or admission).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              internalError: { value: { error: "internal error" } }
              encodeFailed: { value: { error: "failed to encode envelope" } }
              admitFailed: { value: { error: "failed to admit autopilot" } }

/api/webhooks/github:
  post:
    operationId: handleGithubWebhook
    summary: Inbound GitHub App webhook
    description: >-
      server/internal/handler/github.go:1077 (`HandleGitHubWebhook`).
      Public ingress — no Multica auth. Verified via
      `X-Hub-Signature-256: sha256=<hex hmac-sha256>` against a single
      app-wide `GITHUB_WEBHOOK_SECRET`; if that env var is unset, ALL
      webhooks are refused with 404 (refuse-closed), unlike the autopilot
      webhook's not-required fallback. `installation`, `pull_request`, and
      `check_suite`/`check_run`/`status` events are decoded into clean,
      named internal structs (not opaque passthrough); `ping` is
      special-cased; any other `X-GitHub-Event` value is acknowledged
      without its payload ever being parsed.
    tags: [Webhooks]
    security: []
    parameters:
      - name: X-GitHub-Event
        in: header
        required: true
        schema: { type: string, enum: [ping, installation, pull_request, check_suite, check_run, status] }
      - name: X-Hub-Signature-256
        in: header
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: >-
              GitHub's own webhook payload shape for the given
              X-GitHub-Event (제공자 측 payload — see GitHub's webhook event
              documentation). `installation`, `pull_request`, and
              check-suite/check-run/status payloads are read for specific
              fields only (id/account, PR metadata, head SHA/PR numbers
              respectively); all other fields and all other event types
              are accepted but ignored.
    responses:
      '200':
        description: '`event == "ping"` only.'
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: string, const: pong }
      '202':
        description: Accepted for every other event type, handled or not — no response body, and processing failures inside a per-event sub-handler are only logged, never surfaced here.
      '400':
        description: Failed to read the request body.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "read body failed" }
      '401':
        description: Signature verification failed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid signature" }
      '404':
        description: GITHUB_WEBHOOK_SECRET is not configured on this deployment (refuse-closed).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "not found" }

/api/webhooks/stripe:
  post:
    operationId: handleStripeWebhook
    summary: Inbound Stripe billing webhook (raw forward to multica-cloud)
    description: >-
      server/internal/handler/cloud_billing.go:520
      (`HandleCloudBillingStripeWebhook`). Public ingress — no Multica
      auth, and this server does NOT itself verify the Stripe signature:
      it checks only that the `Stripe-Signature` header is present, then
      forwards the raw body bytes verbatim (no JSON parsing/whitespace
      trimming at all) plus that header and the original Content-Type to
      the upstream `multica-cloud` service's `/api/v1/billing/webhooks/stripe`
      [sic] route, which owns STRIPE_WEBHOOK_SECRET and does the actual
      verification. This handler's success response mirrors whatever the
      upstream returns — status/body are not fixed here (소스에서 확인 불가
      beyond "whatever multica-cloud sends back").
    tags: [Webhooks]
    security: []
    parameters:
      - name: Stripe-Signature
        in: header
        required: true
        description: Presence-checked only by this server; the actual HMAC verification happens upstream in multica-cloud.
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: Stripe's own webhook event payload (제공자 측 payload — see Stripe's webhook documentation). Forwarded byte-for-byte, never parsed by this server.
    responses:
      '2XX':
        description: Mirrors whatever the upstream multica-cloud service returned for this forwarded request.
      '400':
        description: Body read failed for a reason other than exceeding the size cap.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid request body" }
      '401':
        description: Stripe-Signature header missing or empty.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "missing Stripe-Signature header" }
      '403':
        description: The multica-cloud runtime integration is not configured for this deployment.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErrorCode' }
            example: { error: "cloud runtime is not configured", code: "cloud_runtime_not_configured" }
      '413':
        description: Body exceeds the 1 MiB cap.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "request body is too large" }
      '429':
        description: Rate limited by IP.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "rate limit exceeded" }

/api/webhooks/vcs/{connectionId}:
  post:
    operationId: handleVcsWebhook
    summary: Inbound VCS (Forgejo/Gitea/GitLab) webhook
    description: >-
      server/internal/handler/vcs_webhook.go:91 (`HandleVCSWebhook`).
      Public ingress — no Multica auth. `{connectionId}` selects the
      workspace/provider/decryption secret. Authenticated per-connection
      by the resolved provider's own scheme: Forgejo/Gitea verify
      `X-Gitea-Signature` as a bare hex HMAC-SHA256 of the raw body
      (optional `sha256=` prefix tolerated); GitLab verifies
      `X-Gitlab-Token` as a plaintext constant-time shared-token compare
      (not an HMAC). Disabled integration, unconfigured secret store, and
      unknown connection id are all indistinguishable (same 404). Event
      type is classified from per-provider headers
      (`X-Gitea-Event`/`X-GitHub-Event` fallback, or `X-Gitlab-Event`);
      an unrecognized event is accepted and silently ignored, still
      returning 202.
    tags: [Webhooks]
    security: []
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: X-Gitea-Signature
        in: header
        required: false
        description: Forgejo/Gitea only — hex HMAC-SHA256 of the raw body.
        schema: { type: string }
      - name: X-Gitlab-Token
        in: header
        required: false
        description: GitLab only — plaintext shared token.
        schema: { type: string }
      - name: X-Gitea-Event
        in: header
        required: false
        schema: { type: string }
      - name: X-Gitlab-Event
        in: header
        required: false
        schema: { type: string, enum: ["Merge Request Hook", "Pipeline Hook"] }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            description: >-
              Provider-defined payload — Forgejo/Gitea pull_request &
              status webhook payloads, or GitLab Merge Request Hook /
              Pipeline Hook payloads, depending on which provider
              `connectionId` resolves to (제공자 측 payload, 상세는 각 제공자
              문서 참조). Internally normalized per-provider into shared
              PullRequestEvent/CIStatusEvent shapes before use.
    responses:
      '202':
        description: Accepted — the only success path, used uniformly for both processed and silently-ignored (unrecognized) event types. No response body.
      '400':
        description: Invalid connectionId UUID, or the request body could not be read.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidConnectionId: { value: { error: "invalid connection id" } }
              readFailed: { value: { error: "read body failed" } }
      '401':
        description: Signature/token verification failed for the resolved provider.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid signature" }
      '404':
        description: VCS integration disabled, secret store not configured, or connection id not found (all indistinguishable).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "unknown connection" }
      '500':
        description: Unrecognized provider string stored on the connection, or webhook-secret decryption failed.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              unknownProvider: { value: { error: "unknown provider" } }
              secretError: { value: { error: "secret error" } }
