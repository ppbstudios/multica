              $ref: '#/components/schemas/Error'

/api/integrations/composio/connections/{id}:
  delete:
    operationId: DeleteComposioConnection
    summary: Disconnect a Composio connection the caller owns
    tags: [integrations]
    description: >-
      server/internal/handler/integrations_composio.go,
      DeleteComposioConnection. Idempotent at the service layer; a
      connection that does not belong to the caller is a 404 (never leaks
      existence of another user's connection).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Disconnected. No body.
      "400":
        description: id is not a valid UUID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Composio integration not configured or feature-flagged off.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      "404":
        description: Connection not found, or does not belong to the caller.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "502":
        description: Upstream failure disconnecting.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# --- social bindings: full schema per acceptance condition 2 ---
# All five follow one pattern (confirmed identical across lark.go, slack.go,
# dingtalk.go, wecom_web.go, telegram.go): NOT workspace-scoped — the
# redeemer hits this BEFORE they have any workspace context, since
# redemption is what mints the binding row. Identity comes from the
# logged-in session, not the token; the token only proves "this <platform>
# id requested binding". Plain Auth group (requireUserID), no
# RequireHumanActor, so technically any of the four schemes authenticates
# it, though the realistic caller is a browser session following a bot
# deep-link.

/api/lark/binding/redeem:
  post:
    operationId: RedeemLarkBindingToken
    summary: Redeem a Lark account-binding token
    tags: [bindings]
    description: >-
      server/internal/handler/lark.go, RedeemLarkBindingToken. Consume +
      bind happen in one DB transaction
      (lark.BindingTokenService.RedeemAndBind).
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RedeemLarkBindingTokenRequest'
    responses:
      "200":
        description: Bound successfully.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemLarkBindingTokenResponse'
      "400":
        description: Invalid body or blank token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: >-
          Either "lark integration not configured" (ErrorCode
          lark_not_configured) or "binding refused (are you a workspace
          member?)" (plain Error, lark.ErrBindingNotWorkspaceMember).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorCode'
                - $ref: '#/components/schemas/Error'
      "409":
        description: This Lark open_id is already bound to a different Multica user.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "410":
        description: Binding token unknown, consumed, or expired.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "500":
        description: Unclassified redemption failure.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

