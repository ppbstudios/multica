/api/cloud-subscriptions/summary:
  get:
    operationId: GetCloudWorkspaceSubscriptionSummary
    summary: Get the active workspace's subscription summary
    tags: [cloud-subscriptions]
    description: >-
      Forwards GET /api/v1/subscriptions/{workspaceId}/summary
      (server/internal/handler/cloud_billing.go,
      GetCloudWorkspaceSubscriptionSummary). Member-readable (any workspace
      role). Served from Cloud's own database without calling Stripe, so it
      stays available while Stripe is degraded; a Cloud build that predates
      this endpoint answers 404, which the client must NOT treat as "Free"
      (handler doc comment).
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
    responses:
      "200":
        description: Upstream subscription summary, forwarded verbatim. 소스에서 확인 불가.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "400":
        description: No resolvable workspace_id/workspace_slug.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: >-
          Any of: human-actor-only guard rejected a machine credential;
          workspace_subscriptions_disabled feature flag off (ErrorCode);
          caller is not a workspace member.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "404":
        description: Cloud build predates this endpoint — MUST NOT be read as "Free" (handler doc comment).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "502":
        description: Upstream request failed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

