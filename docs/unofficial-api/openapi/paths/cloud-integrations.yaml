    description: >-
      server/internal/handler/plugin_surface.go, ServePluginSurface. Only
      served on the dedicated Plugin Surface origin
      (h.cfg.PluginSurfaceOrigin matched against the request Host);
      intentionally outside the session middleware so that origin stays
