/api/cloud-subscriptions/checkout-sessions:
  post:
    operationId: CreateCloudWorkspaceSubscriptionCheckout
    summary: Create a workspace subscription Checkout session
    tags: [cloud-subscriptions]
    description: >-
      Forwards POST /api/v1/subscriptions/checkout-sessions. The handler
      injects workspace_id (from context, not trusted from the client) and
      the authenticated user's stored email server-side — a caller cannot
      smuggle a different workspace or Stripe payer identity (handler doc
      comment). Requires workspace role owner or admin
      (middleware.RequireWorkspaceRole, router.go).
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CloudSubscriptionCheckoutRequest'
    responses:
      "200":
        description: Upstream Checkout session payload, forwarded verbatim. 소스에서 확인 불가.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "400":
        description: Invalid body, bad `interval`, or missing idempotency key (body field or header).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: >-
          Human-actor-only guard; workspace_subscriptions_disabled
          (ErrorCode); not a member; or role is neither owner nor admin
          ("insufficient permissions").
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "500":
        description: Failed to resolve the checkout payer's email server-side.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "502":
        description: Upstream request failed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

