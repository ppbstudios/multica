# --- integrations: Composio (full schema per acceptance condition 2) ---

/api/integrations/composio/connect/init:
  post:
    operationId: ComposioConnectInit
    summary: Start a hosted Composio auth flow for a toolkit
    tags: [integrations]
    description: >-
      server/internal/handler/integrations_composio.go, ComposioConnectInit.
      User-scoped (a Composio connection belongs to a user, not a
      workspace) — sits under plain Auth, no workspace-membership
      requirement. 403 (ErrorCode composio_not_configured) when
      COMPOSIO_API_KEY is unset or the composio_mcp_apps feature flag is off.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ComposioConnectInitRequest'
    responses:
      "200":
        description: Redirect URL for the hosted Composio Connect flow.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposioConnectInitResponse'
      "400":
        description: Invalid body, blank toolkit_slug, or unsupported toolkit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Composio integration not configured or feature-flagged off.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      "502":
        description: Failed to start the Composio connect flow upstream.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/integrations/composio/callback:
  get:
    operationId: ComposioCallback
    summary: Composio hosted-flow OAuth browser redirect target
    tags: [integrations]
    description: >-
      server/internal/handler/integrations_composio.go, ComposioCallback.
      PUBLIC route (outside the Auth group — MUL-3843): the browser
      frequently arrives here without a session cookie (expired session,
      SameSite/ITP stripping, private window, self-hosted callback
      subdomain). Identity comes solely from the HMAC-signed `state` query
      param, verified before anything else runs. Always responds with an
      HTTP redirect (302) back to the settings page, success or failure —
      every failure mode collapses to the same generic error redirect so the
      browser is never left on a blank API response and the caller can't
      distinguish which check failed.
    security: []
    parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: HMAC-signed state token minted when the connect flow began; verified (signature, expiry, replay) before use.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Composio-supplied flow outcome signal. Allowed value set not independently re-verified (소스에서 확인 불가 beyond "non-success collapses to failure").
      - name: connected_account_id
        in: query
        required: false
        schema:
          type: string
    responses:
      "302":
        description: >-
          Redirect to the settings page, with a success or generic-failure
          indicator in the query string (h.Composio.CallbackRedirect). No
          JSON body — 내부/인프라 전용, 스키마 미기재 for the redirect
          target's own query shape.
      "403":
        description: Composio integration not configured or feature-flagged off.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'

/api/integrations/composio/connections:
  get:
    operationId: ListComposioConnections
    summary: List the caller's active Composio connections
    tags: [integrations]
    description: server/internal/handler/integrations_composio.go, ListComposioConnections.
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - CloudNodePAT: []
      - BrowserSession: []
    responses:
      "200":
        description: The caller's connections.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ComposioConnectionResponse'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Composio integration not configured or feature-flagged off.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
      "500":
        description: Failed to list connections.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/integrations/composio/toolkits:
