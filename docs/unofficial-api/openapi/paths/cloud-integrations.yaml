# Domain: cloud/연동
# Owner: dedicated domain ticket.
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — add operations here, not under a
# nested "paths:" key.
#
# Scope (58 endpoints per the originating ticket): cloud-billing,
# cloud-subscriptions, cloud-runtime, integrations/composio, the five
# chat-platform binding-token redeem endpoints, and a grab-bag of
# process-level infra routes (health/readyz/ws/uploads/avatars/
# plugin-surfaces/config/auth-refresh/auth-logout/feedback/hooks/
# search-index/workspace-wakeups).
#
# Per the ticket's acceptance condition 2, full request/response schemas are
# written for cloud-billing, cloud-subscriptions, integrations (composio),
# and the five social bindings. Everything else is infra-tier: path+method+
# security are registered, but schema is intentionally omitted and each such
# operation's description says so explicitly ("내부/인프라 전용, 스키마
# 미기재") rather than guessing a shape.
#
# IMPORTANT CAVEAT on the "full schema" endpoints: cloud-billing and
# cloud-subscriptions are proxies to an external multica-cloud HTTP service
# (server/internal/handler/cloud_billing.go, cloud_runtime.go — see
# proxyCloudRuntime/proxyCloudSubscription). Their REQUEST bodies are real Go
# structs validated locally (documented precisely below), but their 2xx
# RESPONSE bodies are forwarded byte-for-byte from upstream — no Go type in
# this repo unmarshals them. Those responses use
# #/components/schemas/CloudProxyResponse (additionalProperties: true) with
# an explicit "소스에서 확인 불가" note instead of invented field names.
#
# Path-list discrepancy found and corrected here (not silently): the
# originating ticket lists "POST /hooks/{key}". router.go has exactly one
# matching registration, r.Post("/hooks/{key}", h.InvokePluginHook)
# (~line 1635), but it is nested inside r.Route(pluginBridgePrefix, ...)
# where pluginBridgePrefix = "/api/plugin-bridge/v1" (router.go ~line 58,
# 1631). The true path is therefore /api/plugin-bridge/v1/hooks/{key}; the
# ticket's static chi-brace-depth extraction evidently lost the enclosing
# Route's prefix. Registered below under the corrected full path — same
# handler, same operation, path fixed rather than reproducing the error.
#
# PPBM-3042 addition (12 endpoints missed by the originating ticket's static
# parse, found during Stage 4 final router.go reconciliation):
#   - /auth/google, /auth/send-code, /auth/verify-code: siblings of the
#     already-documented /auth/logout, registered right next to it
#     (router.go ~line 1515-1518) but not extracted before.
#   - The 9 /api/plugin-bridge/v1/* routes other than hooks/{key}: the
#     static parse read registerPluginActionRoutes' definition once and
#     only picked up its FIRST call site (the official /v1 Public Plugin
#     Action API, out of scope — see server/pkg/publicapi/v1/openapi.yaml),
#     missing that the same function is called again for the
#     pluginBridgePrefix group (router.go ~line 106-116, ~line 1639).
#     Documented here as Plugin*-prefixed schemas distinct from this file's
#     own Issue/Comment names (see the schema file's header), and using
#     application/problem+json (PluginProblem) rather than this document's
#     usual Error/ErrorCode — see securitySchemes.yaml's CloudNodePAT
#     deviation note for why these use PersonalAccessToken/AgentTaskToken/
#     CloudNodePAT/BrowserSession rather than the ticket's assumed mcn_-only
#     scheme.

/api/cloud-billing/balance:
  get:
    operationId: GetCloudBillingBalance
    summary: Get the caller's cloud billing wallet balance
    tags: [cloud-billing]
    description: >-
      Forwards GET /api/v1/billing/balance to the multica-cloud service with
      X-User-ID stamped from the authenticated context
      (server/internal/handler/cloud_billing.go, GetCloudBillingBalance).
      Account-level (not workspace-scoped) — available without an active
      workspace selected. Human actors only: a running agent (mat_ task
      token) or cloud-node PAT (mcn_) is refused (see
      handler.RequireHumanActor rationale in
      server/internal/handler/actor_guards.go).
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    responses:
      "200":
        description: Upstream wallet balance payload, forwarded verbatim. 소스에서 확인 불가 (see domain file header).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: >-
          Either "this endpoint is only available to human actors" (plain
          Error) — caller authenticated with a mat_/mcn_ machine credential
          — or "cloud runtime is not configured" (ErrorCode
          cloud_runtime_not_configured, via writeFeatureDisabled). Same 403
          status, distinguished only by the response body's `code` field.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "502":
        description: Upstream multica-cloud request failed (writeCloudRuntimeError default case).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

