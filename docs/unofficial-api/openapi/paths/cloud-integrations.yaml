      Forwards GET /api/v1/billing/transactions. Upstream supports `page` /
      `page_size` query params per the handler's own comment, forwarded
      unchanged (cloudRuntimeProxyOptions.withQuery) — not validated or
      typed locally, so not declared as formal `parameters` here (소스에서
      확인 불가 beyond the comment). Human actors only; account-level.
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    responses:
      "200":
        description: Upstream transaction list, forwarded verbatim. 소스에서 확인 불가.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Human-actor-only guard rejected a machine credential, or cloud runtime is not configured (writeFeatureDisabled, ErrorCode).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "502":
