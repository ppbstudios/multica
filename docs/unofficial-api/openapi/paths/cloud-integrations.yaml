      boundary, not just by omission. The encrypted path `{token}` binds
      installation + immutable version + surface + one bridge challenge.
      내부/인프라 전용, 스키마 미기재.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: 내부/인프라 전용, 스키마 미기재. Hosted plugin document bytes.
      "400":
        description: Request carried a Cookie or Authorization header (forbidden on this origin by design).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "404":
        description: Wrong host for the configured Plugin Surface origin, or token invalid/unresolvable.

