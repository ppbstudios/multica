/api/cloud-billing/checkout-sessions:
  post:
    operationId: CreateCloudBillingCheckoutSession
    summary: Create a cloud billing (owner-credit) Stripe Checkout session
    tags: [cloud-billing]
    description: >-
      Forwards POST /api/v1/billing/checkout-sessions. Body shape per the
      handler's own comment (not enforced by a local Go struct — forwarded
      as opaque validated-JSON bytes): `{tier_id, customer_email?}`. 이 요청
      바디 필드는 핸들러 주석 기준이며 Go 구조체로 강제되지 않음 — 업스트림
      계약, 소스에서 타입 검증 불가.
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: >-
              Not locally typed; proxyCloudRuntime only checks the body is
              syntactically valid JSON (readCloudRuntimeJSONBody) before
              forwarding. Per-comment shape: `{tier_id, customer_email?}`.
            additionalProperties: true
    responses:
      "200":
        description: Upstream Checkout session payload, forwarded verbatim. 소스에서 확인 불가.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "400":
        description: Request body missing, oversized, or not valid JSON.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Human-actor-only guard rejected a machine credential, or cloud runtime is not configured.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "502":
        description: Upstream request failed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/cloud-billing/checkout-sessions/{sessionId}:
  get:
    operationId: GetCloudBillingCheckoutSession
    summary: Get a cloud billing Checkout session by id
    tags: [cloud-billing]
    description: >-
      Forwards GET /api/v1/billing/checkout-sessions/{session_id}.
      `sessionId` is allow-list validated locally before being spliced into
      the upstream URL (isValidStripeSessionID: non-empty
      `[A-Za-z0-9_]+`, handler ~line 451) to prevent path/query injection
      into the proxied request — not a Stripe-format check per se.
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_]+$'
    responses:
      "200":
        description: Upstream Checkout session payload, forwarded verbatim. 소스에서 확인 불가.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudProxyResponse'
      "400":
        description: session_id missing or fails the allow-list pattern.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Human-actor-only guard rejected a machine credential, or cloud runtime is not configured.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "502":
        description: Upstream request failed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

