/health/realtime:
  get:
    operationId: GetRealtimeMetrics
    summary: "내부/인프라 전용, 스키마 미기재 — realtime subsystem operational counters"
    tags: [infra]
    description: >-
      server/cmd/server/health_realtime.go, realtimeMetricsHandler (MUL-1342).
      NOT one of the five documented securitySchemes — flagged deviation:
      access is either (a) `Authorization: Bearer <REALTIME_METRICS_TOKEN>`
      when that env var is set, a bespoke shared-secret scheme distinct from
      every mul_/mat_/mcn_/cookie/mdt_ scheme in securitySchemes.yaml, or (b)
      direct-loopback-only (127.0.0.1/::1, no forwarding headers) when the
      env var is unset, in which case non-loopback callers get 404 (not 401)
      so the endpoint is not enumerable. 내부/인프라 전용, 스키마 미기재.
    security: []
    responses:
      "200":
        description: 내부/인프라 전용, 스키마 미기재. JSON snapshot of realtime + daemonws counters.
      "401":
        description: Token configured but missing/wrong (WWW-Authenticate challenge set).
      "404":
        description: No token configured and caller is not direct-loopback (endpoint hidden, not merely denied).

/ws:
  get:
    operationId: ConnectRealtimeWebSocket
    summary: "내부/인프라 전용, 스키마 미기재 — primary realtime WebSocket upgrade"
    tags: [infra]
    description: >-
      server/cmd/server/router.go ~line 1459 -> realtime.HandleWebSocket
      (server/internal/realtime/hub.go). "Cookie or first-message auth" per
      the function's own doc comment — not gated by any of the standard
      securitySchemes at the HTTP-upgrade layer; workspace is resolved from
      a `workspace_id` or `workspace_slug` query parameter. Not representable
      as a normal HTTP request/response pair. 내부/인프라 전용, 스키마
      미기재.
    security: []
    parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: workspace_slug
        in: query
        required: false
        schema:
          type: string
    responses:
      "101":
        description: Switching Protocols — WebSocket handshake accepted. No body.

/uploads/{path}:
  get:
    operationId: ServeLocalUpload
    summary: "내부/인프라 전용, 스키마 미기재 — local-disk file serving (LocalStorage backend only)"
    tags: [infra]
    description: >-
      server/internal/handler/file.go, ServeLocalUpload. Only mounted when
      the server is configured with the LocalStorage backend
      (router.go ~line 1470, type-asserted); 404 if a different storage
      backend is active (the route is unregistered in that case — this
      operation entry documents the chi pattern, not a guaranteed-live
      route). Served through the handler (not a bare static file server) so
      it carries the same preview security headers as the authenticated
      attachment-download endpoint. The route is registered in chi as a
      `*` wildcard (matches any number of remaining path segments);
      OpenAPI 3.1 path templating has no wildcard syntax, so it is
      represented here as a single named path parameter `path` holding the
      full remaining segment verbatim — this is a documentation-format
      substitution, not a change to the actual route shape.
      내부/인프라 전용, 스키마 미기재.
    security: []
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Storage key, taken verbatim from the URL path after `/uploads/`.
    responses:
      "200":
        description: 내부/인프라 전용, 스키마 미기재. Raw file bytes with the stored content type.
      "404":
        description: Backend is not LocalStorage, or the key does not resolve to a file.

/api/avatars/{sig}/{path}:
  get:
    operationId: ServeAvatar
    summary: "내부/인프라 전용, 스키마 미기재 — HMAC-signed public avatar image serving"
    tags: [infra]
    description: >-
      server/internal/handler/avatar.go, ServeAvatar. Public by necessity
      (handler doc comment): the auth cookie is SameSite=Strict, so this
      cannot be a cookie-gated URL for a native <img src> from
      Desktop/mobile webview or a split-origin self-hosted web app. The
      HMAC signature in `{sig}` is the sole credential; it covers the
      storage key, only image keys resolve, and the object must be
      avatar-class. Deny shape is a flat 404 for every failure reason (bad
      signature, unknown key, non-image key, non-publishable object) so the
      route is not an existence oracle. The trailing segment is a chi `*`
      wildcard (matches any number of remaining path segments); OpenAPI
      3.1 has no wildcard path syntax, so it is represented here as a
      named path parameter `path` — a documentation-format substitution,
      not a change to the actual route shape. 내부/인프라 전용, 스키마
      미기재.
    security: []
    parameters:
      - name: sig
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: URL-escaped storage key.
    responses:
      "200":
        description: 내부/인프라 전용, 스키마 미기재. Raw image bytes.
      "404":
        description: Bad signature, unknown/non-image key, or object not avatar-class-publishable (indistinguishable by design).

/plugin-surfaces/{token}:
