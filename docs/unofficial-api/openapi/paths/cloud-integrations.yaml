    summary: Ask Cloud to re-count and reconcile workspace seat quantity
    tags: [cloud-subscriptions]
    description: >-
      Forwards POST /api/v1/subscriptions/{workspaceId}/seats/reconcile. A
      hint only — no seat quantity is supplied by this handler or its
      caller; Cloud re-counts human members from its own least-privilege
      product-database connection (handler doc comment). No request body.
      Requires workspace role owner or admin.
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
