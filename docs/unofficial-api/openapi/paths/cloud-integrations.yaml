              $ref: '#/components/schemas/Error'
      "401":
        description: Not authenticated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      "403":
        description: Human-actor-only guard, feature-disabled, or not-a-member (see summary operation above for the same triple).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      "502":
        description: Upstream request failed (includes "Price cannot be validated", per handler comment surfaced as 503 by Cloud and relayed as a 502/error here — exact passthrough status not independently re-verified).
        content:
