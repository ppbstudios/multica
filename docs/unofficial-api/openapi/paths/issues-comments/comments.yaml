# Comment CRUD, resolution and reactions. Source:
# server/internal/handler/comment.go, reaction.go (baseline revision
# ba30324e10dfc69fb0f0a6732dd3d0f0559e01fe).
#
# /api/comments/{commentId}/sub-issue-preview and .../sub-issues (source:
# source_context.go) were added by PPBM-3043 — missing from the original
# domain pass, found by PPBM-2960's router.go reconciliation. Both are
# human-actor-only (handler.RequireHumanActor).

/api/issues/{id}/comments/trigger-preview:
  post:
    operationId: previewCommentTriggers
    summary: Dry-run which agents a prospective comment would trigger
    description: Pure dry-run — computes trigger candidates without posting anything or enqueueing any task.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: string
                description: Empty after sanitization short-circuits to `200 {"agents":[]}`.
              parent_id:
                type: string
                format: uuid
                description: Must resolve to a comment on this issue; if set, must also match editing_comment_id's parent when both are given.
              editing_comment_id:
                type: string
                format: uuid
                description: Must resolve to a comment on this issue, in this workspace.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentTriggerPreviewResponse'
      '400':
        description: >-
          "invalid request body"; "invalid editing_comment_id"; "invalid
          editing comment"; "invalid parent_id"; "parent_id does not match
          editing comment"; "invalid parent comment".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/IssueNotFound'

/api/issues/{id}/comments:
  get:
    operationId: listComments
    summary: List comments on an issue (flat, threaded, or folded)
    description: >-
      One endpoint serves several mutually-exclusive read modes via query
      params — chronological, thread-anchored with a reply tail, most-recent
      roots, or resolve-aware folding — each documented on its own parameter
      below. `roots_only`, `fold`, `thread`+`tail`, and `recent` are mutually
      exclusive with each other (a combination is a 400); `summary` composes
      with any of them.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: since
        in: query
        schema: {type: string, format: date-time}
        description: RFC3339Nano (falls back to RFC3339).
      - name: thread
        in: query
        schema: {type: string, format: uuid}
        description: Any comment in a thread (root or reply) — the server walks up to the root.
      - name: tail
        in: query
        schema: {type: integer, minimum: 0}
        description: 'Requires `thread`. Capped at 2000. `tail=0` returns just the root.'
      - name: recent
        in: query
        schema: {type: integer, minimum: 1}
        description: Number of most-recently-active threads to return, capped at 2000. Mutually exclusive with `thread`.
      - name: before
        in: query
        schema: {type: string, format: date-time}
        description: Pagination cursor timestamp; must be set together with before_id.
      - name: before_id
        in: query
        schema: {type: string, format: uuid}
        description: 'Pagination cursor id (alias `before-id`); must be set together with `before`, and paired with either `recent` or `thread`+`tail`.'
      - name: roots_only
        in: query
        schema: {type: boolean}
        description: 'Alias `roots-only`. Only top-level comments, each annotated with reply_count + last_activity_at.'
      - name: summary
        in: query
        schema: {type: boolean}
        description: Clips each comment's content to 200 runes, sets content_truncated.
      - name: fold
        in: query
        schema: {type: boolean}
        description: Resolve-aware thread projection — collapses a resolved thread to root+conclusion or root-only.
    responses:
      '200':
        description: >-
          OK — a flat, chronological (oldest-first) JSON array. Response
          headers (not part of the JSON body): `X-Multica-Next-Before` /
          `X-Multica-Next-Before-Id` (pagination cursor for the next page,
          when present) and `X-Comments-Truncated: true` (set when the 2000
          comment hard cap truncated results).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CommentResponse'
      '400':
        description: >-
          Invalid combinations/values of the parameters above (each has its
          own message, e.g. "invalid since parameter; expected RFC3339
          format", "tail requires thread", "before and before_id must be set
          together", "thread and recent are mutually exclusive",
          "roots_only"/"fold" mutual-exclusivity messages).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        description: '"issue not found", or "thread anchor not found in this issue" when `thread` does not resolve within this issue.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to list comments".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  post:
    operationId: createComment
    summary: Post a comment on an issue
    description: May trigger one or more agents (issue assignee, @-mentions, thread-parent authors) depending on content and parent_id.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: string
                minLength: 1
                description: Sanitized for embedded NUL bytes; empty after sanitizing is a 400.
              type:
                type: string
                enum: [comment, progress_update]
                default: comment
                description: Only these two types are client-authorable.
              parent_id:
                type: string
                format: uuid
                description: Must belong to the same issue.
              attachment_ids:
                type: array
                items: {type: string, format: uuid}
              suppress_agent_ids:
                type: array
                items: {type: string, format: uuid}
              steer_task_ids:
                type: array
                items: {type: string, format: uuid}
                description: Forced to empty when attachment_ids is non-empty (a running turn receives text only).
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '400':
        description: >-
          "content is required"; "invalid comment type"; "invalid
          parent_id"/"invalid parent comment"; "invalid attachment_ids";
          "invalid suppress_agent_ids"; "invalid steer_task_ids".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        description: '"issue not found" — either from loadIssueForUser, or (race) a CreateComment write failing because the issue was deleted mid-request.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          "comment-triggered tasks cannot create top-level comments; set
          parent_id (--parent) to `<trigger_comment_id>` or a coalesced
          comment id" (an agent author's active comment-triggered task tried
          to post without parent_id, or with the wrong one); "squad leader
          recorded no_action; comments are not allowed for this task".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to create comment: <err>".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/comments/{commentId}/sub-issue-preview:
  get:
    operationId: previewCommentSubIssue
    summary: Preview the source context a sub-issue would capture from this comment's thread
    description: >-
      server/internal/handler/source_context.go:406-422
      (`PreviewCommentSubIssue`). Human-actor-only
      (`handler.RequireHumanActor`). Builds an immutable snapshot of the
      comment's whole thread (from its root ancestor down through the
      anchor comment, source issue included) without persisting anything,
      and returns an opaque `capture_token` the create call must echo back
      unchanged. Read-only; safe to call repeatedly (e.g. to refresh after
      `source_context_changed`).
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentSubIssuePreviewResponse'
      '400':
        description: Invalid `workspace_id`/`comment_id`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"this endpoint is only available to human actors" (also reflected in `security` above by the absence of `AgentTaskToken`/`CloudNodePAT`), or the caller is not a workspace member ("workspace not found").'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          `anchor_comment_deleted` (the comment is gone or tombstoned —
          NOT a 404, since the comment id itself was reachable via the
          URL), `source_context_invalid_path` (the comment's ancestor
          chain is malformed: not a comment type, cycle detected, broken
          root linkage), or `source_issue_deleted`.
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              properties:
                error: { type: string }
                code:
                  type: string
                  enum: [anchor_comment_deleted, source_context_invalid_path, source_issue_deleted]
      '422':
        description: '`source_context_too_large` — the thread exceeds the max-comments cap; `limits` carries the actual count.'
        content:
          application/json:
            schema:
              type: object
              required: [error, code, limits]
              properties:
                error: { type: string }
                code: { type: string, const: source_context_too_large }
                limits: { $ref: '#/components/schemas/SourceContextLimitUsage' }

/api/comments/{commentId}/sub-issues:
  post:
    operationId: createCommentSubIssue
    summary: Create a sub-issue from a captured comment-thread context
    description: >-
      server/internal/handler/source_context.go:428-500
      (`CreateCommentSubIssue`). Human-actor-only
      (`handler.RequireHumanActor`). Requires a `capture_token` from the
      immediately preceding `GET .../sub-issue-preview` call; re-validates
      it against a fresh rebuild of the context (digest + source issue id)
      before proceeding, so a thread that changed between preview and
      submit is rejected rather than silently captured stale. On success,
      clones the thread's attachments into the new context's own storage
      objects (best-effort cleanup of the clones if the subsequent create
      fails). `mode: manual` creates the issue synchronously; `mode: agent`
      enqueues an agent quick-create task that performs the capture
      itself — the agent-mode request's own `quick_create.parent_issue_id`
      field, if sent, is silently ignored (the parent is always the
      captured source issue).
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateCommentSubIssueRequest'
    responses:
      '201':
        description: '`mode: manual` — sub-issue created synchronously.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueResponse'
      '202':
        description: '`mode: agent` — quick-create task enqueued; the sub-issue itself does not exist yet.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCreateIssueResponse'
      '400':
        description: >-
          "invalid request body"; `mode` is not `manual`/`agent`; manual
          mode missing `issue`/`issue.title`; agent mode missing
          `quick_create`, with neither/both of `agent_id`/`squad_id`, an
          invalid `priority`, or other `QuickCreateIssueInput` field
          validation failures (see the quick-create endpoint for the full
          catalog — same validation code path); invalid `workspace_id`/
          `comment_id`/`assignee_id`/`project_id`/`attachment_ids`/
          `label_ids`/dates.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '402':
        description: Workspace issue-count limit reached (checked before cloning attachments, so a near-limit workspace never pays the clone cost for a request that will be refused).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLimitReachedResponse'
      '403':
        description: >-
          "this endpoint is only available to human actors"; caller not a
          workspace member; assignee-pair permission check failed (manual
          mode); or the caller is not permitted to invoke the target
          agent/squad (agent mode).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"squad not found or archived"; "agent not found"; "project not found" (either mode).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          `source_context_changed` (capture_token's digest no longer
          matches a fresh rebuild, or names a different source issue —
          this is also the response when the token itself fails to
          parse); `anchor_comment_deleted`; `source_issue_deleted`;
          `source_context_invalid_path`; `source_context_already_attached`;
          `active_duplicate_issue` (manual mode, unless
          `allow_duplicate: true` on the issue body).
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              properties:
                error: { type: string }
                code:
                  type: string
                  enum:
                    - source_context_changed
                    - anchor_comment_deleted
                    - source_issue_deleted
                    - source_context_invalid_path
                    - source_context_already_attached
                    - active_duplicate_issue
      '422':
        description: >-
          `source_context_too_large` (carries `limits`);
          `source_context_quick_create_unsupported` (agent mode, selected
          runtime lacks the source-context quick-create daemon
          capability); `agent_unavailable` (agent mode, target not ready
          to invoke); `daemon_version_unsupported` (agent mode, daemon/CLI
          too old for `priority`/`due_date` on this flow).
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [error, code, limits]
                  properties:
                    error: { type: string }
                    code: { type: string, const: source_context_too_large }
                    limits: { $ref: '#/components/schemas/SourceContextLimitUsage' }
                - $ref: '#/components/schemas/AgentUnavailableResponse'
                - $ref: '#/components/schemas/DaemonVersionUnsupportedResponse'
                - type: object
                  required: [error, code]
                  properties:
                    error: { type: string }
                    code: { type: string, const: source_context_quick_create_unsupported }
      '500':
        description: '"failed to check issue capacity"; generic creation failure (manual mode); or any other unclassified internal error.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '502':
        description: '`source_context_attachment_copy_failed` — cloning the thread''s attachments into the new context failed.'
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              properties:
                error: { type: string }
                code: { type: string, const: source_context_attachment_copy_failed }

/api/comments/{commentId}:
  put:
    operationId: updateComment
    summary: Edit a comment's content/attachments
    description: >-
      `content_base` or `expected_revision` makes this a "strict content
      edit" with optimistic-concurrency enforcement; omitting both edits
      best-effort without a conflict check.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - $ref: '#/components/parameters/IfMatchHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: string
                minLength: 1
              content_base:
                type: string
                description: 'Presence makes this a "strict content edit"; a 409 EditConflict is raised if it no longer matches the current content.'
              attachment_ids:
                type: array
                items: {type: string, format: uuid}
                description: 'When the key is present (even an empty array), this replaces the full attachment set.'
              suppress_agent_ids:
                type: array
                items: {type: string, format: uuid}
              expected_revision:
                type: integer
                format: int64
                minimum: 1
                description: Optimistic-concurrency fence; presence also makes this a "strict content edit".
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '400':
        description: >-
          Invalid `comment id`/`workspace id`; "invalid request body";
          "content is required"; "expected_revision must be a positive
          integer"; "invalid attachment_ids"/"invalid suppress_agent_ids".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"only comment author or admin can edit".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"comment not found" (missing, or a tombstoned comment with no content to edit).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: >-
          "additional messages cannot be edited" (comment bound to a task
          supplement); a revision mismatch (eager check, or lost on a
          concurrent write); or a content_base mismatch when no
          expected_revision was supplied.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RevisionConflict'
                - $ref: '#/components/schemas/EditConflict'
                - $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to verify additional message"; "failed to load issue"; "failed to prepare comment edit"; "failed to update comment".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    operationId: deleteComment
    summary: Delete a comment
    description: >-
      Behaviorally identical to `DELETE .../keep-replies` below (both routes
      share the exact same handler and code path) — a comment with replies
      is always tombstoned (content/attachments/reactions cleared, row
      kept so replies retain their parent); only a reply-less comment (and
      any now-replyless tombstone ancestors) is actually removed. The
      `/keep-replies` alias exists purely so a client depending on the
      "replies are kept" guarantee gets a clean 404 against an older server
      that would instead cascade-delete, rather than a silent behavior
      change.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Deleted (or tombstoned) — no body.
      '400':
        description: Invalid `comment id`/`workspace id`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"only comment author or admin can delete".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"comment not found" (missing, already tombstoned, or removed concurrently).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: '"additional message is still being delivered" (a pending task supplement is bound to this comment).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to load issue"; "failed to delete comment".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/comments/{commentId}/keep-replies:
  delete:
    operationId: deleteCommentKeepReplies
    summary: Delete a comment, guaranteeing replies are kept (routing-compatibility alias)
    description: See DELETE /api/comments/{commentId} — this route is byte-identical in behavior on this server version; it exists only so an older server (pre #8296) 404s instead of silently cascade-deleting replies.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '204':
        description: Deleted (or tombstoned) — no body.
      '400':
        description: Invalid `comment id`/`workspace id`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"only comment author or admin can delete".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"comment not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: '"additional message is still being delivered".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to load issue"; "failed to delete comment".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/comments/{commentId}/resolve:
  post:
    operationId: resolveComment
    summary: Mark a comment thread as resolved
    description: Clears any other resolved comment in the same thread first (single-resolution-per-thread invariant); re-resolving an already-resolved comment is a no-op that does not re-broadcast.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '400':
        description: 'Invalid `comment id`/`workspace id`; "invalid actor id" (defensive, actor resolved to a non-UUID string).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        description: '"comment not found" (missing, tombstoned, or removed between load and write); workspace/member lookup failure.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to resolve comment".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    operationId: unresolveComment
    summary: Clear a comment thread's resolved state
    description: Publishes an unresolved event only if it was previously resolved (no-op suppression otherwise).
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '400':
        description: Invalid `comment id`/`workspace id`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        description: '"comment not found" (missing, tombstoned, or workspace/member lookup failure).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to unresolve comment" (also covers a comment deleted concurrently — there is no special-cased 404 here, unlike resolve).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/comments/{commentId}/reactions:
  post:
    operationId: addCommentReaction
    summary: Add an emoji reaction to a comment
    description: No format/allowlist validation on `emoji` — any non-empty string is accepted and stored verbatim. The write is serialized under a per-comment lock against concurrent delete.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [emoji]
            properties:
              emoji: {type: string, minLength: 1}
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionResponse'
      '400':
        description: 'Invalid `comment id`/`workspace id`; "invalid request body"; "emoji is required".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"comment not found" (missing, tombstoned, or deleted concurrently between the check and the write).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to add reaction".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
  delete:
    operationId: removeCommentReaction
    summary: Remove an emoji reaction from a comment
    description: Matches by (actor, emoji) on this comment; removing a reaction that doesn't exist is a no-op.
    tags: [comments]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [emoji]
            properties:
              emoji: {type: string, minLength: 1}
    responses:
      '204':
        description: Removed — no body. A no-op removal (reaction didn't exist) still returns 204, without broadcasting.
      '400':
        description: 'Invalid `comment id`/`workspace id`; "invalid request body"; "emoji is required".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"comment not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to remove reaction".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
