# Issue-scoped agent task execution surface: active task, cancel, run
# history, usage, rerun, quick actions, squad-leader evaluation. Source:
# server/internal/handler/daemon.go, task_lifecycle.go, quick_action.go,
# squad.go (baseline revision ba30324e10dfc69fb0f0a6732dd3d0f0559e01fe).
# IssueTaskResponse is a partial schema — the canonical, complete task
# shape belongs to the agents/tasks domain ticket.

/api/issues/{id}/active-task:
  get:
    operationId: getActiveTaskForIssue
    summary: List an issue's currently-active agent tasks
    description: A query failure degrades to an empty list rather than a 500 — this endpoint essentially never errors once the issue itself resolves.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveTaskListResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/IssueNotFound'

/api/issues/{id}/tasks/{taskId}/cancel:
  post:
    operationId: cancelTask
    summary: Cancel a specific agent task on an issue
    description: A task UUID belonging to a different issue (even in the same workspace) is rejected as not-found, same as a genuinely unknown id.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK — the cancelled task.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTaskResponse'
      '400':
        description: 'Any error from the cancellation service (e.g. task not in a cancellable state) — message is the service''s own text, not a fixed string.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        description: '"task not found" — either the task id doesn''t exist, or it exists but belongs to a different issue.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/tasks/{taskId}/supplements:
  post:
    operationId: createTaskSupplement
    summary: Steer a running agent turn with an additional message
    description: >-
      server/internal/handler/task_supplement.go:218-303
      (`CreateTaskSupplement`). PPBM-3043 — missing from the original
      domain pass, found by PPBM-2960's router.go reconciliation.
      Human-actor-only (`handler.RequireHumanActor`). Adds one ordinary
      comment to the issue that is simultaneously bound to this exact
      run as a "steering message" the running daemon picks up mid-turn.
      `client_request_id` makes a resubmission idempotent — a repeat with
      the same (task, author, client_request_id) returns the original
      comment again with `200`, not a duplicate `201`. The run must still
      be `running` and its daemon must advertise the task-supplement
      capability, or the request is refused rather than silently queued
      for a turn that will never read it.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: Must belong to this issue, or "task not found".
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateTaskSupplementRequest'
    responses:
      '200':
        description: Idempotent replay — `client_request_id` was already used for this (task, author); returns the existing comment unchanged.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '201':
        description: Created — the new steering comment, with its delivery receipt embedded (`supplements`/`supplement_*` fields).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentResponse'
      '400':
        description: '"invalid request body"; "content is too long"; "content is required"; invalid `client_request_id`/`workspace_id`/`user_id`/`task_id`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"this endpoint is only available to human actors"; or `invocation_not_allowed` (caller cannot invoke the task''s agent).'
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"task not found" — missing, or belongs to a different issue.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: '`task_supplement_turn_ended` — the run is no longer `running` (checked both before and, as a race fallback, on the insert itself); or a plain `"client_request_id is already in use"` on a unique-constraint race that the idempotent lookup did not catch.'
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
            examples:
              turnEnded: { value: { error: "this run has ended", code: "task_supplement_turn_ended" } }
              requestIdReused: { value: { error: "client_request_id is already in use" } }
      '412':
        description: '`task_supplement_unsupported` — the run''s daemon does not advertise the task-supplement capability.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
            example: { error: "this run does not support additional messages", code: "task_supplement_unsupported" }
      '500':
        description: '"failed to check additional message"; "failed to create additional message".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/tasks/{taskId}/supplements/{commentId}/retry:
  post:
    operationId: retryTaskSupplement
    summary: Retry delivering a steering message the daemon failed to pick up
    description: >-
      server/internal/handler/task_supplement.go:344-374
      (`RetryTaskSupplement`). PPBM-3043 — missing from the original
      domain pass, found by PPBM-2960's router.go reconciliation.
      Human-actor-only (`handler.RequireHumanActor`).

      Path-list discrepancy found and corrected here: the originating
      ticket lists this route as `POST .../supplements/retry` (no
      `{commentId}`). router.go has exactly one matching registration,
      `r.With(handler.RequireHumanActor).Post("/tasks/{taskId}/supplements/{commentId}/retry",
      h.RetryTaskSupplement)` — the true path includes `{commentId}`,
      registered below under the corrected full path, same handler.

      A duplicate retry of a supplement that is still `pending` is treated
      as an idempotent success rather than an error.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: Must belong to this issue, or "task not found".
      - name: commentId
        in: path
        required: true
        schema: {type: string, format: uuid}
        description: The comment whose supplement delivery is being retried.
    responses:
      '200':
        description: OK — the supplement's (possibly unchanged, if the retry was a duplicate-of-pending) delivery receipt.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSupplementReceiptResponse'
      '400':
        description: 'Invalid `comment_id`/`workspace_id`/`user_id`/`task_id`.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: '"this endpoint is only available to human actors"; or `invocation_not_allowed`.'
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/ErrorCode'
      '404':
        description: '"task not found".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: '`task_supplement_not_retryable` — no matching, retryable supplement row for this (comment, task).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorCode'
            example: { error: "this message cannot be retried", code: "task_supplement_not_retryable" }
      '500':
        description: '"failed to retry additional message".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/task-runs:
  get:
    operationId: listTasksByIssue
    summary: List agent task runs for an issue, or for its whole issue family
    description: >-
      Two response shapes depending on `scope`: `family` returns a capped
      (20-row), running-first coordination summary across the issue's
      parent-rooted family with no attribution hydration; the default
      (`issue`) returns the full execution-log rows for just this issue,
      newest-first, with no cursor pagination.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: scope
        in: query
        schema: {type: string, enum: [issue, family], default: issue}
        description: '`family` roots the query at the issue''s parent (or the issue itself if it has none) and implicitly forces in-flight-only semantics.'
      - name: active
        in: query
        schema: {type: boolean, default: false}
        description: '`issue` scope only; strict boolean parse (any other literal value is a 400). Ignored in effect under scope=family (which is always active-only).'
    responses:
      '200':
        description: >-
          OK — a bare JSON array (ActiveRunSummary[] for scope=family,
          IssueTaskResponse[] otherwise). Response header
          `X-Active-Runs-Truncated: true` is set on the family branch when
          more than 20 rows existed.
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ActiveRunSummary'
                - type: array
                  items:
                    $ref: '#/components/schemas/IssueTaskResponse'
      '400':
        description: '"scope must be ''issue'' or ''family''"; "invalid active parameter; expected boolean".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/IssueNotFound'
      '500':
        description: '"failed to list tasks".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/usage:
  get:
    operationId: getIssueUsage
    summary: Aggregate token/cost usage across all of an issue's agent tasks
    description: A single flattened aggregate — no per-model/provider breakdown (unlike a task row's own `usage` array) and no separate currency field (cost is in fixed-point "USD ticks").
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
    responses:
      '200':
        description: 'OK — zeroed counters for an issue with no tasks (not a 404).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUsageSummaryResponse'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/IssueNotFound'
      '500':
        description: '"failed to get issue usage".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/rerun:
  post:
    operationId: rerunIssue
    summary: Re-dispatch a fresh agent run on an issue
    description: >-
      Without `task_id`, targets the issue's current assignee; a run in
      Triage with no named source task is refused (naming a non-triage
      source task is still allowed). The new task starts a fresh session
      (no session resume).
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RerunIssueInput'
      description: Optional — an empty/absent body preserves legacy "rerun current assignee" behavior.
    responses:
      '202':
        description: Accepted
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTaskResponse'
      '400':
        description: '"invalid request body"; "invalid task_id"; or any other error from the rerun service (its own message text — e.g. "source task does not belong to this issue").'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: Dispatch blocked — the resolved actor cannot invoke the target agent, or the issue is in Triage with no source task named.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBlockedResponse'
      '404':
        $ref: '#/components/responses/IssueNotFound'

/api/issues/{id}/quick-actions/{quickActionId}/run:
  post:
    operationId: runQuickAction
    summary: Post a quick action's stored prompt as a comment and dispatch its bound target
    description: >-
      Takes no body — the quick action's stored prompt/target are used
      verbatim, with no runtime interpolation. The response is a regular
      CommentResponse whose `quick_action_id` is the marker a client uses to
      render a collapsed quick-action card.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: quickActionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickActionRunResponse'
      '400':
        description: '"invalid quick action id"; "quick action is archived".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: 'Issue is in Triage (checked before posting — a quick action is an instruction to act now), or the caller cannot invoke the bound target (the one and only invoke-permission check for quick actions).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBlockedResponse'
      '404':
        description: '"issue not found", or "quick action not found" (also returned, instead of 403, for a private action owned by someone else — existence itself is not disclosed).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Bound target (agent/squad) is archived, deleted, or its leader is archived.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBlockedResponse'
      '500':
        description: '"failed to run quick action".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/issues/{id}/quick-actions/{quickActionId}/render:
  post:
    operationId: renderQuickAction
    summary: Preview what a quick action would post, without posting it
    description: >-
      Shares the exact rendering function RunQuickAction uses, so preview
      and actual post are always identical. Unlike run, this endpoint does
      not check Triage state and does not check whether the action is
      archived — only the invoke-permission gate is shared between the two.
    tags: [issues, tasks]
    security:
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier.
      - name: quickActionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickActionRenderResponse'
      '400':
        description: '"invalid quick action id".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        description: Caller cannot invoke the bound target.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBlockedResponse'
      '404':
        description: '"issue not found", or "quick action not found" (also for a private action owned by someone else).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '409':
        description: Bound target is archived, deleted, or its leader is archived.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBlockedResponse'

/api/issues/{id}/squad-evaluated:
  post:
    operationId: recordSquadLeaderEvaluation
    summary: Record a squad leader agent's evaluation outcome for its current task
    description: >-
      Agent-only, and specifically only the live squad leader (checked
      twice: once against the claimed task's own agent_id, once against the
      squad's *current* leader — the leader may have been swapped between
      enqueue and claim). Writes one activity_log row; does not touch
      comments directly (its effect is read elsewhere to suppress a
      no-action comment for this task).
    tags: [issues, tasks]
    security:
      - AgentTaskToken: []
    parameters:
      - $ref: '#/components/parameters/XAgentIDHeader'
      - $ref: '#/components/parameters/XTaskIDHeader'
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: UUID or `PREFIX-NUMBER` identifier — the issue the task is expected to be running on.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SquadLeaderEvaluationInput'
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SquadLeaderEvaluationResponse'
      '400':
        description: >-
          "invalid task id"; "invalid request body"; "outcome must be
          'action', 'no_action', or 'failed'"; "task does not belong to
          issue" (task lookup failed, or — after the ownership gate passes —
          the task's real issue differs from the path issue, naming that
          real issue id); "task is not a squad leader task"; "leader task
          has no squad_id".
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '403':
        description: '"only the squad leader agent can record evaluations" — used identically whether the caller fails the task-ownership gate or the still-current-leader gate (the two cases are indistinguishable to the caller by design).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '404':
        description: '"issue not found"; "squad not found" (looked up after the ownership gate passes).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        description: '"failed to record evaluation".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

# ---------------------------------------------------------------------------
# PPBM-3043 — missing from the original domain pass, found by PPBM-2960's
# router.go reconciliation. Not nested under /api/issues/{id} — a top-level
# /api/tasks/{taskId} route — but documented here as the closest existing
# tasks-domain home (server/internal/handler/task_lifecycle.go, shares its
# response type and retry semantics with /api/issues/{id}/rerun above).
# ---------------------------------------------------------------------------

/api/tasks/{taskId}/retry-source-context:
  post:
    operationId: retrySourceContextQuickCreate
    summary: Retry a failed issue-less quick-create that was capturing a source context
    description: >-
      server/internal/handler/task_lifecycle.go:234-273
      (`RetrySourceContextQuickCreate`). Human-actor-only
      (`handler.RequireHumanActor`). Manually re-enqueues a failed
      quick-create task, atomically moving its pending immutable source
      context (captured via `POST /api/comments/{commentId}/sub-issues`
      with `mode: agent`) onto the fresh retry task. Workspace is resolved
      from context (the authenticated session's current workspace), not a
      request header. Requires the original requester and passes the
      normal private-agent invoke gate again.
    tags: [tasks]
    security:
      - PersonalAccessToken: []
      - BrowserSession: []
    parameters:
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    responses:
      '202':
        description: Accepted — fresh retry task enqueued.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTaskResponse'
      '400':
        description: 'Invalid `workspace_id`/`user_id`/`task_id`; or any other error surfaced verbatim from the retry service.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '402':
        description: Workspace issue-count limit reached.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLimitReachedResponse'
      '403':
        description: >-
          "this endpoint is only available to human actors"; or dispatch
          blocked (`ReasonInvocationNotAllowed` — the caller cannot invoke
          the target agent).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/DispatchBlockedResponse'
      '409':
        description: '`source_context_retry_unavailable` — the captured context can no longer be retried (e.g. superseded by a later branch point).'
        content:
          application/json:
            schema:
              type: object
              required: [error, code]
              properties:
                error: { type: string }
                code: { type: string, const: source_context_retry_unavailable }
      '500':
        description: '"retry source context quick create".'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
