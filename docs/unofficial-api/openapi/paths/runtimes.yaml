      (`UnbindAgentsAndDeleteRuntime` — the exact same handler function as
      POST .../unbind-agents-and-delete, byte-for-byte; this is a second
      route bound to it, not a separate implementation). Kept only for
      installed clients built against the pre-MUL-5559
      archive-and-delete naming; current clients should use
      POST .../unbind-agents-and-delete. Request/response bodies, status
      codes and every error case are identical to that operation — see it
      for full detail, including the success body's `agents_archived` field
      (a deprecated mirror of `agents_unbound` kept specifically so clients
      calling this legacy route still read the count under the name they
      expect).
