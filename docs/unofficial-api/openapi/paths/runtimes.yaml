/api/runtimes/{runtimeId}/local-skills/import:
  post:
    operationId: initiateRuntimeLocalSkillImport
    summary: Import one locally-discovered skill from a runtime into the workspace
    description: >-
      server/internal/handler/runtime_local_skills.go:635-697
      (`InitiateImportLocalSkill`). Requires the runtime be online — 503 if
      not. Access gate is `requireRuntimeLocalSkillAccess`, STRICTLY
      owner-only (no workspace owner/admin override, unlike `canEditRuntime`
      elsewhere in this domain) because the import reads full skill file
      contents off the owner's own machine — this holds even for a `public`
      runtime, which only grants other members the ability to RUN agents on
      it, not to pull files off it. `action: "overwrite"` only validates
      that `target_skill_id` is a well-formed UUID at this step; existence
      and creator-only overwrite permission are re-verified authoritatively
      when the daemon later reports its result (the skill may have changed
      between this call and that report), so this endpoint can enqueue a
      request that still fails at report time for those reasons.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CreateRuntimeLocalSkillImportRequest' }
    responses:
      '200':
        description: Enqueued; poll via GET .../local-skills/import/{requestId}.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeLocalSkillImportRequest' }
      '400':
        description: >-
          `"invalid runtime_id"`; `"invalid request body"`; `"skill_key is
          required"` (empty after trimming); `"invalid target_skill_id"`
          (malformed UUID, only checked when `action` is `"overwrite"`);
          `"invalid action"` (anything other than omitted/empty or
          `"overwrite"`). Plus the file-level "Workspace gate" 400s.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              skillKeyRequired: { value: { error: "skill_key is required" } }
              invalidTargetSkillId: { value: { error: "invalid target_skill_id" } }
              invalidAction: { value: { error: "invalid action" } }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"insufficient permissions"` — caller is a workspace member but not this runtime''s owner (the strict owner-only gate described above; note a workspace owner/admin who is not the runtime''s owner is also refused here).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "insufficient permissions" }
      '404':
        description: '`"runtime not found"` — see the file-level note; private-runtime information hiding applies.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to enqueue local skill import: <err>"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '503':
        description: '`"runtime is offline"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime is offline" }

/api/runtimes/{runtimeId}/local-skills/import/{requestId}:
  get:
    operationId: getRuntimeLocalSkillImportRequest
    summary: Poll the status of a local-skill import request
    description: >-
      server/internal/handler/runtime_local_skills.go:699-718
      (`GetLocalSkillImportRequest`). Same strict owner-only
      `requireRuntimeLocalSkillAccess` gate as the initiate endpoint above.
      A terminal `status: "conflict"` response (see
      `RuntimeLocalSkillImportConflict`) is not an error — it means a
      same-name skill already existed and the caller opted into the
      structured-conflict contract; the caller is expected to re-submit a
      new import with `action: "overwrite"` (if `can_overwrite` is true) or
      a renamed `name`.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: requestId
        in: path
        required: true
        schema: { type: string }
        description: Opaque 32-character lowercase-hex id returned as `id` by POST .../local-skills/import — not a UUID.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeLocalSkillImportRequest' }
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"insufficient permissions"` — caller is not this runtime''s owner (strict owner-only gate, no admin override).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "insufficient permissions" }
      '404':
        description: >-
          `"runtime not found"` (runtime-level gate), or `"request not
          found"` (the `requestId` doesn't resolve, or belongs to a
          different runtime).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              runtimeNotFound: { value: { error: "runtime not found" } }
              requestNotFound: { value: { error: "request not found" } }
      '500':
        description: '`"failed to load request: <err>"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
