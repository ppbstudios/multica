/api/runtimes/{runtimeId}/local-skills:
  post:
    operationId: initiateRuntimeLocalSkillList
    summary: Request the list of skills (and MCP servers) found locally on a runtime
    description: >-
      server/internal/handler/runtime_local_skills.go:594-612
      (`InitiateListLocalSkills`). Requires the runtime be online — 503 if
      not. No caching layer here (unlike the sibling model-list endpoint):
      every call enqueues a fresh pending request and nudges the daemon to
      heartbeat immediately. Read-only discovery — this does not import
      anything into the workspace; see POST .../local-skills/import for
      that. Access gate is `requireRuntimeCapabilityReadAccess`: a private
      runtime's capability inventory is readable by its owner only (no
      admin override, same as the usage/model endpoints), but a PUBLIC
      runtime's inventory is readable by any workspace member — narrower
      than that is the local-skill-IMPORT pair below, which stays
      owner-only even for a public runtime because import reads full skill
      file contents off the owner's machine. No request body is read.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    responses:
      '200':
        description: Enqueued; poll via GET .../local-skills/{requestId}.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeLocalSkillListRequest' }
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid runtime_id" }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`"runtime not found"` — see the file-level note; private-runtime information hiding applies.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to enqueue local skills request: <err>"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '503':
        description: '`"runtime is offline"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime is offline" }

