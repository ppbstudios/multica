      '500':
        description: Identical to POST .../unbind-agents-and-delete.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/runtimes/{runtimeId}/update:
  post:
    operationId: initiateRuntimeUpdate
    summary: Request a daemon-side CLI update for a runtime
    description: >-
      server/internal/handler/runtime_update.go:213-260 (`InitiateUpdate`).
      Enqueues a pending `RuntimeUpdateRequest`; the daemon claims it on its
      next heartbeat poll and reports the result back out-of-band (via the
      daemon-auth'd `ReportUpdateResult`, out of scope for this domain).
      Caller polls GET .../update/{updateId} to observe pending -> running
      -> completed|failed|timeout. UNLIKE the model/local-skill initiate
      endpoints below, this one does NOT check the runtime's online status
      before enqueueing — an update requested for an offline runtime simply
      sits `pending` until its 120-second timeout.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InitiateRuntimeUpdateRequest' }
    responses:
      '200':
        description: >-
          Enqueued. NOTE: 200, not 201, despite creating a new pending
          request record — consistent with the other two initiate endpoints
          in this domain.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeUpdateRequest' }
      '400':
        description: >-
          `"invalid runtime_id"`; `"invalid request body"`; `"target_version
          is required"` (empty string). Plus the file-level "Workspace
          gate" 400s.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              targetVersionRequired: { value: { error: "target_version is required" } }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"only runtime owners and workspace admins can update runtimes"` — same `canEditRuntime` gate as PATCH/DELETE, worded for this action.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "only runtime owners and workspace admins can update runtimes" }
      '404':
        description: '`"runtime not found"` — see the file-level note, and the private-runtime information-hiding behavior documented on GET .../usage.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '409':
        description: '`"an update is already in progress for this runtime"` — a pending or running update already exists for this runtime id.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "an update is already in progress for this runtime" }
      '500':
        description: >-
          `"failed to start the update"` — any `UpdateStore.Create` failure
          other than the in-progress conflict above (deliberately NOT
          echoed to the client even though the underlying error is
          available server-side: the Redis-backed store's own error text
          can read like a user-actionable conflict when it is really an
          infrastructure failure, which was survivable while the CLI hid
          409 bodies but is not now that they're shown by default).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to start the update" }

/api/runtimes/{runtimeId}/update/{updateId}:
  get:
    operationId: getRuntimeUpdate
    summary: Poll the status of a runtime CLI-update request
    description: >-
      server/internal/handler/runtime_update.go:263-289 (`GetUpdate`).
      Access is slightly wider than the usual edit gate: in addition to
      `canEditRuntime` (workspace owner/admin, or the runtime's own owner),
      the specific member who INITIATED this particular update may also
      poll it even if they are later demoted from admin — scoped to this
      one immutable request, not a standing grant. Other plain members
      still cannot read another runtime's update status at all.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: updateId
        in: path
        required: true
        schema: { type: string }
        description: Opaque 32-character lowercase-hex id returned as `id` by POST .../update — not a UUID.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeUpdateRequest' }
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"only runtime owners, workspace admins, and the update initiator can view this update"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "only runtime owners, workspace admins, and the update initiator can view this update" }
      '404':
        description: >-
          `"runtime not found"` (runtime-level gate, see the file-level
          note), or `"update not found"` (the `updateId` doesn't resolve to
          a stored request, or resolves to one belonging to a different
          runtime).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              runtimeNotFound: { value: { error: "runtime not found" } }
              updateNotFound: { value: { error: "update not found" } }
      '500':
        description: '`"failed to load update: <err>"` — the update store read itself failed (distinct from a clean not-found).'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/runtimes/{runtimeId}/models:
  post:
    operationId: initiateRuntimeModelList
    summary: Request the list of models a runtime's CLI can run
    description: >-
      server/internal/handler/runtime_models.go:346-391
      (`InitiateListModels`). Requires the runtime be online — 503 if not.
      Fast path (default, `force` omitted/false): if a catalog snapshot
      younger than the server's serve window is cached
      (`ModelCatalogCache`), it is returned immediately as an
      already-`completed` synthetic request (`cached: true`); if that
      snapshot is older than the revalidate threshold, a background refresh
      is ALSO silently enqueued (nobody polls it — it only warms the cache
      for the next open). Slow path (`force=true`, or no usable cache):
      enqueues a real pending request the daemon claims on its next
      heartbeat and nudges the daemon to heartbeat immediately rather than
      waiting out its normal interval. No request body is read.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: force
        in: query
        required: false
        schema: { type: string, enum: ['true'] }
        description: >-
          Exactly the literal string `"true"` skips the server-side cache
          and always waits for a live daemon round trip; any other value
          (including absent) takes the cache-first fast path.
    responses:
      '200':
        description: >-
          Either a synthetic already-`completed` response (cache hit — see
          summary) or a freshly-enqueued `pending` request to poll via GET
          .../models/{requestId}.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeModelListRequest' }
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid runtime_id" }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`"runtime not found"` — see the file-level note and the information-hiding behavior documented on GET .../usage.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to enqueue model list request: <err>"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '503':
        description: '`"runtime is offline"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime is offline" }

