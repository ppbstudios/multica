# Domain: runtimes — agent runtime registry, its usage/activity
# rollups, and the three daemon-mediated async flows (CLI update, model
# discovery, local-skill discovery/import). Source:
# server/internal/handler/{runtime,runtime_update,runtime_models,
# runtime_local_skills}.go; mount points server/cmd/server/router.go
# ~line 2324-2354 (`r.Route("/api/runtimes", ...)`).
#
# Top-level keys are path strings merged verbatim into the document's
# "paths" object by scripts/merge.mjs — do not nest under a "paths:" key.
#
# Scope note: these /api/runtimes/* routes are distinct from
# /api/daemon/runtimes/* and the daemon-report sibling routes mounted
# alongside them in router.go (ReportUpdateResult, ReportModelListResult,
# ReportLocalSkillListResult, ReportLocalSkillImportResult,
# ClaimTaskByRuntime, etc.) — those belong to a separate, out-of-scope
# daemon-auth ticket and are not documented here.
#
# Workspace gate (applies to every operation below, ahead of any
# handler-specific logic): all 18 operations (17 from the original domain
# pass + revoke-workspace-access, added by PPBM-3043 — found missing from
# the original pass by PPBM-2960's router.go reconciliation) sit inside the
# `middleware.RequireWorkspaceMember(queries)` group
# (server/cmd/server/router.go ~line 1986), which runs BEFORE the handler:
#   1. Resolves a workspace id from (in priority order) an `mat_` task
#      token's bound workspace, `X-Workspace-Slug` header, `?workspace_slug`
#      query, `X-Workspace-ID` header, or `?workspace_id` query
#      (server/internal/middleware/workspace.go `resolveWorkspaceUUID`).
#   2. 400 `"workspace_id or workspace_slug is required"` if none of those
#      produced a value.
#   3. 403 `"task token is bound to a different workspace"` if the request
#      authenticated with an `mat_` task token whose bound workspace
#      disagrees with the one just resolved (MUL-2600).
#   4. 401 `"user not authenticated"` if no `X-User-ID` is set (should not
#      happen past the outer Auth middleware, but checked again here).
#   5. 400 `"invalid workspace_id"` if the resolved id isn't a parseable UUID.
#   6. 404 `"workspace not found"` if the authenticated user is not a member
#      of that workspace (`GetMemberByUserAndWorkspace` failure).
#
# For every operation below scoped by a `{runtimeId}` path param, the
# HANDLER then independently re-resolves workspace membership against the
# runtime's OWN `workspace_id` column (not the header-resolved workspace),
# via `requireWorkspaceMember(w, r, uuidToString(rt.WorkspaceID), "runtime
# not found")` — so passing a valid `X-Workspace-ID` for a workspace you do
# belong to does not let you act on a `runtimeId` owned by a workspace you
# are not a member of; that second check 404s with `"runtime not found"`
# instead of `"workspace not found"`. The per-operation response tables
# below list only the handler-level checks; the six outer-gate cases above
# apply uniformly in addition and are not repeated per operation.

/api/runtimes:
  get:
    operationId: listRuntimes
    summary: List agent runtimes in a workspace
    description: >-
      server/internal/handler/runtime.go:902-944 (`ListAgentRuntimes`).
      Response visibility depends on the caller's role: owners/admins see
      every runtime in the workspace (including private ones, for
      governance — rename/delete — even though the per-runtime read/usage
      endpoints below still deny them the private runtime's data); plain
      members see only public runtimes plus their own private ones
      (`ListVisibleAgentRuntimes`). `?owner=me` overrides both branches and
      restricts to runtimes owned by the caller regardless of role.
    tags: [runtimes]
    security: &runtimeAuth
      - PersonalAccessToken: []
      - AgentTaskToken: []
      - BrowserSession: []
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: owner
        in: query
        required: false
        schema:
          type: string
          enum: [me]
        description: When exactly `"me"`, restrict the result to runtimes owned by the caller.
    responses:
      '200':
        description: OK — a flat array, not wrapped in an envelope object.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AgentRuntimeResponse'
      '400':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "user not authenticated" }
      '404':
        description: '`"workspace not found"` — see the file-level "Workspace gate" note.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "workspace not found" }
      '500':
        description: '`"failed to list runtimes"` — any of the three list queries failed.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to list runtimes" }

/api/runtimes/{runtimeId}:
  patch:
    operationId: updateRuntime
    summary: Update a runtime's visibility and/or display name
    description: >-
      server/internal/handler/runtime.go:489-626 (`UpdateAgentRuntime`).
      Every request field is optional (a true PATCH); fields are validated
      in full before any mutation is applied, so a bad value in one field
      never leaves a partially-applied write. On any change, broadcasts
      `daemon:register` (action "update") so connected clients refetch
      runtime list/detail state.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID (validated before lookup); not necessarily the runtime's actual id if malformed.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UpdateAgentRuntimeRequest' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentRuntimeResponse' }
      '400':
        description: >-
          `"invalid runtime_id"` (malformed path param); `"invalid JSON
          body"` (decode failure — note this handler's wording differs from
          most others' `"invalid request body"`); `"visibility must be
          'private' or 'public'"`; `"custom name is too long"` (over 100
          runes after trimming). Plus the file-level "Workspace gate" 400s.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidRuntimeId: { value: { error: "invalid runtime_id" } }
              invalidJsonBody: { value: { error: "invalid JSON body" } }
              invalidVisibility: { value: { error: "visibility must be 'private' or 'public'" } }
              customNameTooLong: { value: { error: "custom name is too long" } }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: >-
          `"you can only edit your own runtimes"` (caller is neither a
          workspace owner/admin nor this runtime's owner —
          `canEditRuntime`), or `"only the runtime owner can change its
          visibility"` (caller may edit the runtime at all, but is not its
          owner and sent a `visibility` value that actually differs from
          the current one — admins do NOT get this override, MUL-6126).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              notEditable: { value: { error: "you can only edit your own runtimes" } }
              visibilityOwnerOnly: { value: { error: "only the runtime owner can change its visibility" } }
      '404':
        description: >-
          `"runtime not found"` — the id doesn't resolve to a row, or the
          caller is not a member of the runtime's actual workspace (see the
          file-level note).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to update runtime"` — the visibility or custom-name write query failed.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to update runtime" }
  delete:
    operationId: deleteRuntime
    summary: Delete a runtime (strict — refuses if any agent is still actively bound)
    description: >-
      server/internal/handler/runtime.go:991-1132 (`DeleteAgentRuntime`).
      Refuses up front (before the transaction even opens) if any
      non-archived agent is bound to the runtime, returning the blocking
      agent list so the confirm dialog can render the cascade plan without
      a second round trip; the user then confirms via POST
      /api/runtimes/{runtimeId}/unbind-agents-and-delete, which reuses this
      same teardown once the confirmed set is re-verified. Re-checks for
      newly-bound agents again under a row lock inside the transaction
      (agent/task inserts take a KEY SHARE lock through their runtime FK)
      before actually tearing down, so a race between the pre-check and the
      transaction cannot silently unbind an agent nobody confirmed.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    responses:
      '200':
        description: >-
          Deleted. NOTE: this is a 200 with a body, not a 204 — unlike most
          delete endpoints elsewhere in this API.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, const: ok }
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "invalid runtime_id" }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"you can only delete your own runtimes"` — caller is neither a workspace owner/admin nor this runtime''s owner.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "you can only delete your own runtimes" }
      '404':
        description: '`"runtime not found"` — see the file-level note.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '409':
        description: >-
          Three distinct shapes, distinguished by `code`: an active
          (non-archived) agent is still bound (`runtime_has_active_agents`,
          checked both before and again inside the transaction); the
          teardown found a non-terminal task that didn't drain in time
          (`runtime_delete_not_drained`); or a cross-workspace agent binding
          was detected (`runtime_delete_workspace_mismatch`, a data-integrity
          guard, not an ordinary user-triggerable case). A profile-backed
          runtime instance whose `runtime_profile` still exists is refused
          here too, with a different, richer shape (see
          `RuntimeProfileInstanceDeleteRefusal`) — checked and returned
          BEFORE the active-agents check, so a profile-backed runtime with
          zero bound agents still 409s rather than deleting.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RuntimeProfileInstanceDeleteRefusal'
                - $ref: '#/components/schemas/RuntimeHasActiveAgentsResponse'
                - $ref: '#/components/schemas/RuntimeDeleteConflict'
      '500':
        description: >-
          `"failed to check runtime profile"`; `"failed to check runtime
          dependencies"`; `"failed to delete runtime"` (tx begin/lock/final
          delete/commit); `"failed to lock runtime"`; `"failed to lock
          runtime dependencies"`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/runtimes/{runtimeId}/usage:
  get:
    operationId: getRuntimeUsage
    summary: Get a runtime's daily token-usage trend
    description: >-
      server/internal/handler/runtime.go:112-130, 134-163
      (`GetRuntimeUsage` / `listRuntimeUsage`). Daily-bucketed rollup from
      `task_usage_hourly`, scoped to Daemon-executed tasks only (excludes a
      user's local CLI usage of the same tool outside Multica). Read
      access, not edit access: governance visibility (owner/admin seeing
      every runtime row in LIST) does NOT extend here — a private runtime's
      usage is readable only by its owner, even for a workspace owner/admin
      (`requireRuntimeReadAccess` / `canUseRuntimeForAgent`, deliberately
      separate from `canEditRuntime`).
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
        description: >-
          Cutoff window size. Out-of-range or non-integer values are
          silently ignored in favor of the default (90) rather than
          rejected with 400. Cutoff is anchored to start-of-day in the
          resolved viewing timezone and yields N+1 calendar buckets
          (today's partial bucket plus N full prior days) — deliberate
          headroom for the runtime-detail page's prior-window delta
          calculation, not an off-by-one to "fix".
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: >-
          IANA timezone for bucketing. Falls back to the authenticated
          user's stored `timezone`, then `"UTC"`, if omitted or unparseable
          — never errors on a bad value (`resolveViewingTZ`).
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RuntimeUsageEntry'
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: >-
          `"runtime not found"` — id doesn't resolve, caller isn't a member
          of the runtime's workspace, OR (information-hiding by design) the
          runtime is private and the caller is not its owner. All three
          cases are indistinguishable on the wire so a private runtime id
          cannot be probed for existence.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to list usage"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to list usage" }

/api/runtimes/{runtimeId}/usage/by-agent:
  get:
    operationId: getRuntimeUsageByAgent
    summary: Get a runtime's token usage broken down by agent
    description: >-
      server/internal/handler/runtime.go:224-265 (`GetRuntimeUsageByAgent`).
      No date bucketing in the response — `tz` only sets the cutoff
      boundary (so "last 30 days" means 30 of the viewer's local calendar
      days), unlike the dated trend returned by the sibling usage endpoint.
      Same private-runtime read gate as GET .../usage.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        description: Cutoff window size; see GET .../usage for the exact cutoff-anchoring behavior (same `parseSinceParamInTZ` helper, different default).
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: IANA timezone for the cutoff boundary only (no date bucketing here). See GET .../usage for the fallback chain.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RuntimeUsageByAgentEntry'
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`"runtime not found"` — see GET .../usage for the three collapsed cases.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to list usage by agent"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to list usage by agent" }

/api/runtimes/{runtimeId}/usage/by-hour:
  get:
    operationId: getRuntimeUsageByHour
    summary: Get a runtime's token usage broken down by hour-of-day
    description: >-
      server/internal/handler/runtime.go:296-335 (`GetRuntimeUsageByHour`).
      Hour-of-day (0..23) bucketed in the resolved viewing timezone, since
      the cutoff window. Hours with zero activity are omitted by the SQL —
      clients fill the gap to render a continuous 0..23 axis. Same
      private-runtime read gate as GET .../usage.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: days
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        description: Cutoff window size; same anchoring behavior as GET .../usage, 30-day default.
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: IANA timezone for both the cutoff and the hour-of-day bucketing. See GET .../usage for the fallback chain.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RuntimeUsageByHourEntry'
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`"runtime not found"` — see GET .../usage for the three collapsed cases.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to get usage by hour"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to get usage by hour" }

/api/runtimes/{runtimeId}/activity:
  get:
    operationId: getRuntimeTaskActivity
    summary: Get a runtime's hourly task-activity distribution
    description: >-
      server/internal/handler/runtime.go:166-194
      (`GetRuntimeTaskActivity`). UNLIKE the three usage endpoints above,
      this one takes NO `days`/cutoff parameter — it aggregates over the
      runtime's entire task history, bucketed by hour-of-day in the
      resolved viewing timezone. Same private-runtime read gate as GET
      .../usage.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
      - name: tz
        in: query
        required: false
        schema: { type: string }
        description: IANA timezone for hour-of-day bucketing. See GET .../usage for the fallback chain (no cutoff is computed here, so `tz` only affects bucketing, not a window boundary).
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/RuntimeTaskActivityEntry'
      '400':
        description: '`"invalid runtime_id"`, plus the file-level "Workspace gate" 400s.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '404':
        description: '`"runtime not found"` — see GET .../usage for the three collapsed cases.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '500':
        description: '`"failed to get task activity"`.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "failed to get task activity" }

/api/runtimes/{runtimeId}/unbind-agents-and-delete:
  post:
    operationId: unbindAgentsAndDeleteRuntime
    summary: Delete a runtime, unbinding every agent still bound to it (confirmed cascade)
    description: >-
      server/internal/handler/runtime.go:1174-1353
      (`UnbindAgentsAndDeleteRuntime`). The confirmed counterpart to the
      strict DELETE above: unbinds every user agent bound to the runtime
      (active and archived — they survive, unbound, and need a new runtime
      to run again; nothing of the user's is destroyed), pauses affected
      Autopilots, cancels active tasks, detaches task history, hard-deletes
      only the runtime's system agents, and finally deletes the runtime row
      — all inside one transaction. Re-lists active agents under a row
      lock inside the transaction and compares against
      `expected_active_agent_ids`; a mismatch means the plan the user
      confirmed is stale (someone added/archived an agent on this runtime
      while the dialog was open) and the request is refused rather than
      silently acting on a different set than what was shown. Prior to
      MUL-5559 this archived the agents and then hard-deleted them,
      destroying their conversations even though the dialog said "archive";
      it no longer destroys anything the user owns.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UnbindAgentsAndDeleteRuntimeRequest' }
    responses:
      '200':
        description: Deleted and torn down.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnbindAgentsAndDeleteRuntimeResponse' }
      '400':
        description: >-
          `"invalid runtime_id"`; `"invalid request body"` (decode
          failure); `"expected_active_agent_ids must be a list of valid
          UUIDs"` (any entry fails UUID parsing). Plus the file-level
          "Workspace gate" 400s.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidRuntimeId: { value: { error: "invalid runtime_id" } }
              invalidBody: { value: { error: "invalid request body" } }
              invalidExpectedIds: { value: { error: "expected_active_agent_ids must be a list of valid UUIDs" } }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"you can only delete your own runtimes"` — caller is neither a workspace owner/admin nor this runtime''s owner.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "you can only delete your own runtimes" }
      '404':
        description: '`"runtime not found"` — see the file-level note.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '409':
        description: >-
          The profile-backed-instance refusal (checked first, same as plain
          DELETE); the confirmed plan went stale
          (`runtime_delete_plan_changed`, carrying the fresh active-agent
          list so the dialog can re-render for a fresh confirmation); or the
          teardown found a non-terminal task that didn't drain in time
          (`runtime_delete_not_drained`). Unlike plain DELETE, this
          operation's teardown does not surface
          `runtime_delete_workspace_mismatch` as a distinct 409 — any such
          failure here falls through to the generic 500 below.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RuntimeProfileInstanceDeleteRefusal'
                - $ref: '#/components/schemas/RuntimeHasActiveAgentsResponse'
                - $ref: '#/components/schemas/RuntimeDeleteConflict'
      '500':
        description: >-
          `"failed to check runtime profile"`; `"failed to start
          transaction"`; `"failed to lock runtime"`; `"failed to lock
          runtime dependencies"`; `"failed to enumerate active agents"`;
          `"failed to unbind agents"` (non-drain teardown failure);
          `"failed to delete runtime"`; `"failed to commit transaction"`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/runtimes/{runtimeId}/revoke-workspace-access:
  post:
    operationId: revokeRuntimeWorkspaceAccess
    summary: Confirm making a public runtime private again, tearing down every non-owner dependent
    description: >-
      server/internal/handler/runtime.go:1039-1127
      (`RevokeRuntimeWorkspaceAccess`). The confirmed counterpart to the
      normal `PATCH /api/runtimes/{runtimeId}` visibility change: that
      PATCH applies directly when no teammate depends on the runtime, and
      otherwise returns a structured 409 plan
      (`RuntimeAccessRevocationPlanResponse`, `runtime_has_nonowner_dependents`)
      for the caller to review; this endpoint applies that reviewed plan
      atomically. In one transaction: flips visibility to `private`,
      cancels every non-owner active task
      (`taskfailure.ReasonRuntimeAccessRevoked`), settles their chats,
      unbinds every non-owner agent, and pauses autopilots bound to those
      newly-unbound agents. Re-validates the confirmed agent/task id sets
      against a fresh row-locked read before committing — a plan that went
      stale between dialog-open and confirm is refused rather than acted
      on blind. Server-side cancellation is authoritative even while the
      runtime's daemon is offline; a disconnected machine simply cannot
      claim new work once the transaction commits.
    tags: [runtimes]
    security: *runtimeAuth
    parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/WorkspaceSlugHeader'
      - name: runtimeId
        in: path
        required: true
        schema: { type: string }
        description: Must be a parseable UUID.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RevokeRuntimeWorkspaceAccessRequest' }
    responses:
      '200':
        description: Made private; dependents torn down.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeWorkspaceAccessRevocationResponse' }
      '400':
        description: >-
          `"invalid request body"`; `"expected_nonowner_agent_ids must be a
          list of valid UUIDs"` / `"expected_task_ids must be a list of
          valid UUIDs"` (an entry fails UUID parsing); `"invalid
          runtime_id"`. Plus the file-level "Workspace gate" 400s.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              invalidBody: { value: { error: "invalid request body" } }
              invalidExpectedAgents: { value: { error: "expected_nonowner_agent_ids must be a list of valid UUIDs" } }
              invalidExpectedTasks: { value: { error: "expected_task_ids must be a list of valid UUIDs" } }
      '401':
        description: See the file-level "Workspace gate" note.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      '403':
        description: '`"only the runtime owner can change its visibility"` — caller is not this runtime''s owner (no admin override, MUL-6126). Checked once before the transaction opens and again after the row lock, in case ownership changed in between.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "only the runtime owner can change its visibility" }
      '404':
        description: '`"runtime not found"` — see the file-level note.'
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            example: { error: "runtime not found" }
      '409':
        description: >-
          Already private (`runtime_access_revocation_not_required`); a
          dependent row is transiently lock-contended
          (`runtime_access_revocation_busy`, Postgres `55P03` — retry); or
          the confirmed agent/task set no longer matches a fresh read
          (`runtime_access_revocation_plan_changed`, carrying the current
          plan so the dialog can re-render for a fresh confirmation).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RuntimeAccessRevocationConflict'
                - $ref: '#/components/schemas/RuntimeAccessRevocationPlanResponse'
      '500':
        description: >-
          `"failed to start transaction"`; `"failed to lock runtime"`;
          `"failed to lock runtime agents"`; `"failed to lock runtime
          chats"`; `"failed to lock runtime tasks"`; `"failed to update
          runtime"`; `"failed to cancel runtime tasks"`; `"failed to settle
          runtime chats"`; `"failed to unbind runtime agents"`; `"failed to
          pause affected autopilots"`; `"failed to commit runtime privacy
          change"`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

/api/runtimes/{runtimeId}/archive-agents-and-delete:
  post:
